apiVersion: aief.dev/project-profile/v1
kind: ProjectProfile

metadata:
  name: ai-novel-studio
  schemaVersion: "1.0"

project:
  identity:
    name: AI Novel Studio
    description: 面向小说作者的桌面优先 AI 创作工作台，围绕作品上下文、对话式创作与可控 Agent 执行组织创作流程。
    ownership: personal
    purposes:
      - personal_tool
      - open_source
    productForms:
      - desktop_app
    audiences:
      - other
    horizon: long_term

  lifecycle:
    stage: unknown
    operatingMode: system_refactoring

  release:
    everReleased: false
    channel: none

  commitments:
    users:
      scope: personal
      support: none

    deployment:
      scope: unknown

    data:
      classification: user_content
      retention: preserve
      recovery: unknown

    compatibility:
      publicApi: none
      internalApi: none
      databaseSchema: unknown
      userData: preserve

    maintenance:
      commitment: long_term

  constraints:
    - id: no-historical-product-compatibility
      statement: The product has not been released; do not retain historical product compatibility layers without an actual consumer or explicit commitment.
      scope: project_wide
    - id: preserve-author-content
      statement: Preserve real author-created content and required quality evidence; no-release status does not authorize destructive resets.
      scope: project_wide
    - id: audit-entity-existence
      statement: Before adding any entity, field, module, or design concept, inspect the repository for an existing equivalent; prefer reuse and consolidation.
      scope: project_wide
    - id: proportional-engineering
      statement: Match engineering complexity to real requirements, known risks, and confirmed evolution; avoid speculative complexity and under-design.
      scope: project_wide
    - id: respect-document-ssot
      statement: Place project knowledge and work products only in the established SSOT locations defined by AGENTS.md; do not create parallel knowledge trees.
      scope: project_wide

  currentFocus:
    summary: B87 model interaction system refactoring, R00-R19 execution plan.
    source: tasks/NEXT.md

