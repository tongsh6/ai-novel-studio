# ─────────────────────────────────────────────────────────────────────────────
# 调用面覆盖探针（surface probes）
#
# 20 例的语义评估入口统一是判断面（§6.1 评估「作者自然表达 → 判断入口理解」）。
# 探针用于证明计划/续行/专业调用面也能被 CP0 冻结；它们不参与 20 例 rubric 与门槛。
# ─────────────────────────────────────────────────────────────────────────────
surface_probes:
  - id: SP01
    call_surface: plan
    title: 多产物请求 → 判断进入计划面，冻结计划起草请求
    author_input: "先设计一个和灯楼有关的新反派，再写第02章的开篇正文。"
    context: 第01章已写；第02章计划中；请求含两个相互依赖的产物。
    freeze_method: |
      以 capture execution 先应答判断①为 judgment_decision{action:plan}（单工具合法），
      由真实判断循环切到 judgment_plan_v1，再捕获 AgenticPlanDraftPlanner 的计划起草请求。
    snapshot: available
    expected_judgment_path: "judgment_decision{action=plan} → profile judgment_plan_v1 → agent_plan_draft 请求"
    required_fields: [request.messages, request.tools, request.tool_choice, profile.profile_ref]
    fixture:
      chapters:
        - seq: 1
          title: "第01章：灯楼夜雨"
          summary: "陈九斤夜守灯楼。"
          prose: [ch01_open, ch01_mid]
        - seq: 2
          title: "第02章：井底回声"
          summary: "陈九斤下井。"
          prose: []

  - id: SP02
    call_surface: continuation
    title: 续行判断（判断②）
    author_input: "（续行②探针：基于真实偏离观察继续或停等）"
    context: |
      续行判断只在 prose_drafting_with_quality 流程出现真实偏离/计划耗尽时触发，
      其 input（goal_text/deviation_summary/observation_block）由流程内部组装。
    freeze_method: |
      CP0 未驱动完整 writer→质量评估→偏离的 run 流程；只记录生产构造器
      JudgmentProtocol.request_continuation/3 与输入组装点，由 B27 CP3 专业调用迁移后
      随真实 writer 流程冻结。
    snapshot: unavailable
    unavailable_reason: |
      续行面的输入（真实偏离 observation）需要先跑完整 prose 起草+质量评估流程；
      CP0 只冻结判断入口请求，避免用合成偏离伪造真实 observation。承接：B27 CP3/CP4
      （prose_drafting_with_quality.ex continuation_judgment/6 与 request_continuation）。
    inherits: B27 CP3（专业调用迁移）+ CP4（语义矩阵）

  - id: SP03
    call_surface: specialized
    title: 专业调用（writer/evaluator/章使命/摘要/盘点/结果叙述）
    author_input: "（专业调用探针：按真实任务输入捕获各专业模板请求）"
    context: |
      专业调用请求需要已校验的任务语义（CreativeRequest/QualityEvaluationRequest）与
      真实 pending artifact/候选；CP0 阶段判断入口快照已冻结下游操作的判定依据。
    freeze_method: |
      CP0 只对判断入口组装的请求负责；writer/evaluator/摘要/盘点/结果叙述的模板
      在 B27 CP3 统一迁移后由同一 freeze 脚本按调用点追加，旧规则臂 hash 已在 arms.yml
      登记，避免在 CP0 用伪造输入替代真实任务语义。
    snapshot: unavailable
    unavailable_reason: |
      专业调用输入依赖完整 run 内已校验任务语义与真实对象；CP0 未驱动完整 run，
      不伪造 CreativeRequest/QualityEvaluationRequest。承接：B27 CP3。
    inherits: B27 CP3（全专业调用迁移）
