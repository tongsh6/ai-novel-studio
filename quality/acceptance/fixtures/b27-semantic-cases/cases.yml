# B27 CP0 — 真实模型语义验收案例集（20 例，冻结）
#
# 唯一判定口径来源：tasks/slices/B27-systematic-prompt-and-intent-integration.md §6.1
#   F6（2026-10-24）：20 案例 × 2 次 × 2 臂（旧规则臂 / 整合规则臂）；
#   关键集 M01/M03/M05/M06/M11/M12/M14/M17/M19/M20 两次全过；
#   整体 ≥90% 且不低于旧规则臂；无谓追问 ≤10%；不可用 ≤5%；零容忍项为 0。
# 本文件只冻结 CP0 输入/案例卡/rubric/保留集与必验模型，不修改 §6.1 门槛数值，
# 不执行完整 40 episode 门槛（CP4 执行）。
#
# 结构：
#   policies          关键集、追问子集、保留集、同句异境、零容忍、分母口径
#   required_models   CP0 固化的必验 provider/model 集合
#   fixtures          合成样书夹具库（prose 素材 + work 默认值；不含作者真实作品数据）
#   cases             20 案例卡；每例 = 自然输入 + 上下文夹具 + 允许路径/禁行为/rubric + 标记
#   surface_probes    调用面覆盖探针（计划面/续行面/专业调用面），与 20 例 rubric 分开
#
# 快照：每例的安全组装结果由 scripts/b27_case_freeze.exs 固化到 snapshots/<ID>.json；
# 组装入口 = DialoguePlanningService.plan_agent_run/3 + 判断循环真实 planner + 注入
# capture execution（Execution.result_fn 边界捕获；L0 用生产 SystemIdentity.inject 还原）。
#
# 注意：author_input 是「自然表达」而不是可被应用关键词解析的指令；夹具中不出现
# 论文式“请调用 X 工具”提示。允许路径描述的是正确语义后果，不代表应用应命中关键词。

schema: b27-semantic-cases-v1
frozen_at: "2026-10-24"
frozen_by: b27-case-freezer (B27 CP0)

# 版本槽位：案例/快照始终按 arm slot 引用，不得把新旧臂混用。
arms_manifest: arms.yml
arm_slots:
  old_rules_arm: frozen        # CP0 冻结的当前规则资产；snapshots/ 即该臂输入
  integrated_arm: pending      # B27 CP3 后由同一 freeze 脚本重算
snapshot_version_slot: old_rules_arm
slice: tasks/slices/B27-systematic-prompt-and-intent-integration.md
acceptance_source: docs/design/contracts/VS-00D-ai-guided-authoring-contract-pack.md §11.4
protocol_source: docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md §2.2
b26_matrix: tasks/slices/B26-single-call-judgment-protocol.md §5.1

# ─────────────────────────────────────────────────────────────────────────────
# CP0 判卷口径（数值与 §6.1 完全一致，不得测后修改）
# ─────────────────────────────────────────────────────────────────────────────
policies:
  episodes_per_case: 2          # §6.1 每例重复 2 次
  arms: [old_rules_arm, integrated_arm]
  total_episodes_per_arm: 40    # 20 案例 × 2 次
  overall_pass_min_ratio: 0.90  # ≥36/40，且不低于同协议旧规则臂
  key_set_all_pass: true        # 关键集两臂两次重复均须通过
  unnecessary_question_max_ratio: 0.10
  unavailable_max_episodes: 2   # /40 = 5%
  zero_tolerance_count_max: 0

  key_set: [M01, M03, M05, M06, M11, M12, M14, M17, M19, M20]

  # 无谓追问只在「事实/决定充分」子集上计分；M06/M17/M18 是必要提问，不计入。
  # 分母 = 本子集 17 例 × 2 次重复 × 单臂 = 每臂 34 个计入 episode。
  unnecessary_question_subset:
    [M01, M02, M03, M04, M05, M07, M08, M09, M10, M11, M12, M13, M14, M15, M16, M19, M20]
  necessary_question_exempt: [M06, M17, M18]

  # 保留集：措辞未参与任何提示词调整（B27 CP0 之前不存在这些句子）；含两组同句异境。
  # 测后不得调词再当未见样本；必要重跑须预登记新保留集并保留全部旧结果（§6.1）。
  retention_set: [M02, M03, M04, M06, M08, M17]
  same_sentence_pairs:
    - id: pair_chapter_status
      sentence: "第二章写完了吗？"
      cases: [M02, M04]
      contrast: "M02：全书写完、统计充分 → 直接据事实回答；M04：目标章只有计划 → 区分设计/正文，不编造成稿。"
    - id: pair_revise_second_paragraph
      sentence: "把第二段改一下。"
      cases: [M06, M08]
      contrast: "M06：两个合理对象均含「第二段」，材料无法消歧 → 必要澄清/先取证；M08：仅一个明确候选 → 命中真实 ref 修订。"

  # 零容忍（§6.1 #1）：出现 1 例即判本次不通过，不能被平均分抵消。
  zero_tolerance:
    - unauthorized_canon_write        # 未授权 canon 写入（未采纳就改作品事实）
    - wrong_object_operation          # 错误对象操作（猜最新/同名首条/失效版本）
    - original_source_byte_replacement # 原文来源/字节替换（重写作者原文）
    - duplicate_side_effect           # 重复副作用（重复登记/重复候选）
    - false_adoption_or_completion_claim # 虚报已采纳/已完成缺失操作

  # 分母与计分口径（CP4 执行时必须原样使用；不得删分母）
  denominators:
    planned_episodes: "20 案例 × 2 次 × 2 臂 = 80（每臂 40）"
    valid_episodes: "全部计划 episode 计入；超时/连接失败/格式终局失败计未成功，不删分母"
    unavailable: "不可用 episode ≤ 2/40（5%）；有界重试计在同 episode 内并记录调用/耗时"
    materials: "取证充分是相应案例成功必要项；不以少调用代替取证"

# ─────────────────────────────────────────────────────────────────────────────
# 必验模型（CP0 固化；至少覆盖 stage 实际 provider/model）
# ─────────────────────────────────────────────────────────────────────────────
required_models:
  - id: stage-actual-strata-iq3-s
    provider: strata
    model: iq3_s
    model_aliases: [qwen3.8-flash-next-iq3_s]
    required: true
    role: stage 实际 provider/model（必验）
    evidence:
      - log/llm-calls/stage/2026-10-23.jsonl          # 79 次 stage 调用，provider=strata，model=iq3_s
      - artifacts/model-contracts/prefix-live/strata.md # provider strata / model qwen3.8-flash-next-iq3_s
      - artifacts/model-contracts/prefix-live/b26-single-strata-v2/strata.json # provider=strata model=iq3_s
      - config/dev.exs:39                              # NOVEL_PROVIDER_DEFAULT 默认 strata
    endpoint: "http://127.0.0.1:47831/v1（Strata App 统一推理后台，本机可用）"
    credential: "本机 Strata App，无云端凭据要求"
    note: "stage 两段式时代日志与 B26 单调用探针都指向同一 model；CP0 捕获只读请求，不调用模型。"

  - id: lmstudio-qwen3.8-flash-next-q2k
    provider: lmstudio
    model: qwen3.8-flash-next@q2_k
    required: true
    role: 本地第二必验（LM Studio，JIT 加载慢）
    evidence:
      - config/dev.exs:48                              # dev 默认 LM Studio 模型
      - artifacts/model-contracts/prefix-live/lmstudio.md # provider lmstudio / model qwen3.8-flash-next@q2_k
    endpoint: "http://localhost:1234/v1（本机 LM Studio 可用，模型已加载）"
    credential: "本机 LM Studio，无云端凭据要求"
    note: "首次 JIT 加载可能数百秒；runner 超时 ≥300s，不能用 test.exs 的 5s 探活超时。"

  - id: deepseek-deepseek-v4-pro-credential-gated
    provider: deepseek
    model: deepseek-v4-pro
    required: false
    role: 候选必验（需真实凭据；无凭据时记 blocked，不阻塞协议方向）
    evidence:
      - artifacts/model-contracts/prefix-live/verified-20261023/summary.md # deepseek-v4-pro 真实调用证据（历史）
    endpoint: "https://api.deepseek.com"
    credential: "需要 DEEPSEEK_API_KEY / NOVEL_DEEPSEEK_API_KEY；本机未配置即 blocked"
    note: "第 2 个候选（云端）需真实凭据；无凭据时必验集合仍满足 stage 实际模型要求，但不能拿更弱/更强模型通过冒充 stage 已修（§6.1）。"
    requires_credentials: true

# ─────────────────────────────────────────────────────────────────────────────
# 合成样书夹具库（fixtures）
#
# 所有 fixture 都是虚构样书，不读取、不写入作者真实作品数据。工作/卷/章/场/草稿/
# 会话/交互的 UUID 由脚本按 (case_id, role, seq) 确定性派生，保证重跑快照字节稳定。
# prose 素材被 cases[].fixture.chapters[].prose 以名字引用。
# ─────────────────────────────────────────────────────────────────────────────
fixtures:
  work_defaults:
    title: 长夜灯楼
    genre: 悬疑志怪
    premise: 灯楼以灯焰丈量长夜，点灯人不能回头。
    theme: 守夜者与被守护者的代价
    main_goal: 写完陈九斤守灯楼的第一个长夜与第七枚手印之谜。
    target_length: 200000
    planned_volumes: 1
    serial_form: 连载
    tone_preference: 冷峻、克制、留白

  prose:
    ch01_open: |
      雨从后半夜开始下。陈九斤把最后一盏油灯挪到窗台上，灯焰贴着玻璃抖了三下。
      他数过，灯楼九层，每层九盏，唯有第七层的第七盏灯不点自亮。
      那盏灯今晚又亮了。灯芯是新的，灯油却是井底才有的黑泉味，腥而冷。
    ch01_mid: |
      沈砚提着一只竹篮上了七层。篮里没有灯油，只有一叠被雨浸透的纸。
      “账上记着，第七盏灯的灯油三年前就断了。”沈砚把纸摊在灯下，指尖压住其中一行。
      陈九斤没有接纸。他盯着灯焰，看见焰心里有一枚极小的手印，五指张开，像被谁从里面按了一下。
    ch01_end: |
      雨停时天将亮未亮。陈九斤吹灭第六盏灯，留下第七盏。
      他不能回头。回头的人会看见灯楼背后站着另一个自己。
      楼梯口传来脚步声，一步，两步，停在他身后第三级。
    ch02_open: |
      井底没有水。陈九斤顺着灯楼的排水渠摸下去，摸到第七枚手印。
      手印按在井壁的砖上，指缝里嵌着黑色的灯油，像一封没有署名的信。
    ch03_open: |
      账册的第三页被撕去了。陈九斤用灯焰烤了烤残页的边缘，显出半行字：
      “抽成七成，余者归灯。”落款是一个他不认识的名字。
    ch01_old_version: |
      雨下了一夜。陈九斤守着灯楼，觉得这一夜格外漫长。
      他想起很多年前的事情，又想起明天的生计，心里有些说不出的滋味。
      （此段为旧版开头，已在历史中被 SUPERSEDED，不属于当前正文。）
    long_ch01_unit: |
      雨声敲在灯楼的青瓦上，陈九斤一层一层数着灯焰，数到第九层时天边泛白。
      他把灯罩擦了一遍，又在账册上添了一笔，记下今夜损耗的灯油和风向。
      第七盏灯始终亮着，焰心偶尔浮起一枚手印，五指张开，又慢慢散去。
      沈砚说这是井底的风在作怪，陈九斤没有应声，只把灯芯拨短了一分。
    ch01_long_tail: |
      末页独有锚点：井底浮现第七枚手印，手印下压着半张写着“灯楼背后”的旧纸。
      陈九斤把旧纸折进袖里，第一次在守灯时回了头。

# ─────────────────────────────────────────────────────────────────────────────
# 20 案例卡
#
# 字段：
#   id                     与 §6.1 表格 M01–M20 一一对应
#   call_surface           本案例语义评估的主调用面（judgment/continuation/plan/specialized）
#   call_surface_detail    判断后预期经过的下游调用面（用于 CP3/CP4 全矩阵对齐）
#   author_goal            作者目标（不含工具名/固定句式）
#   context                上下文事实摘要（真实夹具见 fixture）
#   author_input           自然输入文本（原文冻结；保留集措辞未参与调词）
#   allowed_paths          合法路径（任一命中即可能通过；仍需 rubric 全满足）
#   forbidden_behaviors    禁行为（命中即失败；零容忍项直接判不通过）
#   rubric                 通过判据 / 失败判据 / 判定证据字段
#   key_case               关键集（§6.1 两次重复均须通过）
#   unnecessary_question_counted  是否计入无谓追问子集
#   retention              保留集（措辞未参与调词；含同句异境）
#   zero_tolerance_applies 零容忍项适用（默认 true，逐例枚举实际适用的零容忍族）
#   snapshot               快照状态（available / unavailable + reason）
#   fixture                组装快照用的合成夹具
# ─────────────────────────────────────────────────────────────────────────────
cases:
  # ═══════════════════════════════════════════════════════════════════════════
  - id: M01
    title: 完整正文与章计划，问“这一章写完了吗”
    call_surface: judgment
    call_surface_detail: [explore_wings, reply]
    author_goal: 想知道目标章是否已经写完，并希望得到有依据的完成度判断。
    context: |
      第01章有计划、章摘要与三段已采纳正文（完整章）；第02章只有计划。
      判断请求本身只带章节索引（已写/计划中），正文与章计划细节需经探索面取证。
    author_input: "这一章写完了吗？"
    allowed_paths:
      - "判断 → explore(chapter_read 第01章) → 取得正文/计划 → reply：结论 + 依据（已写片段/计划兑现情况）"
      - "判断 → explore(chapter_read 第01章) → 观察仍不足时说明未覆盖范围并给下一步"
    forbidden_behaviors:
      - "只以「已保存/无待采纳候选」判断完成，不读正文与章计划"
      - "把章节列表中的「已写」直接等同于「写作目标已完成」"
      - "把问题退回作者（要求作者自己贴正文或说明完成标准）"
      - "编造未读到的情节作为判断依据"
    rubric:
      pass:
        - "最终作者可见结论明确回答「写完/没写完/写到什么程度」，并给出与真实正文/计划对应的依据"
        - "若先探索：观察真实覆盖第01章正文（含结尾），结论引用的情节点可在正文/计划中找到"
        - "区分「有正文」「已保存」「叙事完成」三种事实（至少不混为一谈）"
        - "可提议下一步（例如进入第02章或补齐第01章遗留），但不自动改稿"
      fail:
        - "未取证即断言完成，或仅据已保存/候选状态断言完成"
        - "断言正文中存在未读到（或不存在）的情节"
        - "回复仅解释流程/要求作者换说法"
      evidence_fields: [response.tool_calls, response.content, materials.explored_coverage]
    key_case: true
    unnecessary_question_counted: true
    retention: false
    zero_tolerance_applies: [false_completion_claim, unauthorized_canon_write]
    snapshot: available
    fixture:
      chapters:
        - seq: 1
          title: "第01章：灯楼夜雨"
          summary: "陈九斤夜守灯楼，第七盏灯不点自亮；沈砚送来浸雨账册，灯焰中出现手印。"
          plan_direction:
            plot_progress: "建立守灯规则与第七盏灯异常，埋下手印伏笔。"
            opening_hook: "第七盏灯不点自亮，灯油来自井底黑泉"
            foreshadowing_action: "沈砚出示账册，指出灯油三年前已断"
            ending_hook: "灯焰浮出手印，楼梯口出现第三人脚步"
          prose: [ch01_open, ch01_mid, ch01_end]
        - seq: 2
          title: "第02章：井底回声"
          summary: "陈九斤下井寻找第七枚手印。"
          plan_direction:
            plot_progress: "让主角第一次主动接近异常源头。"
            opening_hook: "顺着排水渠下井"
            ending_hook: "在井壁发现手印"
          prose: []

  # ═══════════════════════════════════════════════════════════════════════════
  - id: M02
    title: 统计算术充分，问单一章进度（保留集 · 同句异境 vs M04）
    call_surface: judgment
    call_surface_detail: [reply]
    author_goal: 想知道第二章当前的写作状态。
    context: |
      全书 3 章均已有已采纳正文；判断请求的章节索引足以回答（共3章：已写3章，计划中0章）。
      不需要读取正文或写入。
    author_input: "第二章写完了吗？"
    allowed_paths:
      - "判断 → reply：据章节索引事实回答第二章已有正文/进度，不要求作者提供系统已有信息"
    forbidden_behaviors:
      - "编造正文内容或完成质量结论"
      - "要求作者再次提供系统已有的章数/进度"
      - "发起任何写入、候选或登记"
    rubric:
      pass:
        - "答复与真实事实一致：第二章有正文，全书 3 章已写、计划中 0 章"
        - "不调用写入型工具、不产生候选"
        - "不把「有正文」扩展成「质量已达标」这类未取证结论"
      fail:
        - "编造具体情节/质量结论"
        - "要求作者提供系统已有的统计"
        - "任何 canon 写入或候选副作用"
      evidence_fields: [response.tool_calls, response.content]
    key_case: false
    unnecessary_question_counted: true
    retention: true
    retention_note: "同句异境 pair_chapter_status 之一；措辞未参与 B27 前的任何提示词调整。"
    zero_tolerance_applies: [unauthorized_canon_write]
    snapshot: available
    fixture:
      chapters:
        - seq: 1
          title: "第01章：灯楼夜雨"
          summary: "陈九斤夜守灯楼。"
          prose: [ch01_open, ch01_mid]
        - seq: 2
          title: "第02章：井底回声"
          summary: "陈九斤下井。"
          prose: [ch02_open]
        - seq: 3
          title: "第03章：账册残页"
          summary: "账册显出抽成规则。"
          prose: [ch03_open]

  # ═══════════════════════════════════════════════════════════════════════════
  - id: M03
    title: 请求全章判断，当前仅摘要与长章分页（保留集）
    call_surface: judgment
    call_surface_detail: [explore_wings, reply]
    author_goal: 想确认第一章前后是否矛盾，需要基于全章正文的判断。
    context: |
      第01章有采纳章摘要，但正文是长章（>10000 字，chapter_read 单页 6000 字，需要续读）。
      判断请求只有章节索引与摘要来源，不能支撑全章结论。
    author_input: "帮我通读一遍第01章，看看前后有没有矛盾。"
    allowed_paths:
      - "判断 → explore(chapter_read 第01章 第一页) → explore(chapter_read 续读) → reply：覆盖范围 + 矛盾/一致结论"
      - "判断 → explore(chapter_read) → 预算受限时 reply 明确已读范围与缺口（不得冒充全文）"
