id: agent-conversation-turn
title: 普通对话输入统一进入 AgentRun（判断纪元 reply 直通）
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-conversation-turn --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/design/adr/ADR-0025-judgment-driven-interactive-loop-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - every-user-message-starts-agent-run
  - mechanical-context-preparation-precedes-judgment
  - judgment-action-is-model-authored-and-source-bound
  - reply-only-turn-does-not-call-tool-or-write
  - channel-has-no-dialogue-fallback-main-chain

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: plain conversation input（无任何 deviation fixture 标记）
  - wait_for: bounded AgentRun fast ack（run_mode=bounded，profile_ref=judgment_loop_v1）
  - wait_for: 机械准备 1 步（context 组装）完成
  - wait_for: 判断①两段式（author_reasoning 叙事 + planner 判断）共 2 次 provider 调用完成，judgment_decided(action=reply)
  - wait_for: 作者可见最终回复内联携带 provider 来源的叙事前缀，turn_result_ready
  - verify: 同一 run 的最终 TurnResult 无工具调用、无采纳、无生产写入

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-conversation-turn-tauri

assertions:
  ui:
    - 作者发送消息后立即出现 AI 工作态骨架，不等待完整模型叙事
    - AgentRun 面板达到 completed，作者可读回复可见
    - 判断步（judgment_decided）与内联回复叙事在作者面可见
  network:
    - parent user_message 在最终 TurnResult 前收到 bounded run_id
    - author_reasoning_delta 事件至少 2 个，且 UI 叙事流随累积 delta 增长
    - 判断① 的 judgment_action=reply、judgment_narrative_source_type=provider_output，judgment 在叙事之后
    - agent_run_state 记录 profile_ref=judgment_loop_v1、consumed_steps=2、tool_calls=0、provider_calls=2、replans=0
    - provider 持久化事实与预算一致，purposes 含 author_reasoning 与 planner
    - 最终 TurnResult 携带同一 run_id 与 profile_ref=judgment_loop_v1
  data:
    - channel 记录 bounded ack，且 log_sync_turn_count=0
    - 普通对话 turn 无 toolbox.execute 事件
    - truthfulness 报告 tool_called=false、artifact_adopted=false、production_write_performed=false

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
