id: agent-conversation-turn
title: 普通对话输入统一进入 AgentRun
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-conversation-turn --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - every-user-message-starts-agent-run
  - conversation-main-stages-are-author-visible-agent-events
  - author-reasoning-delta-streams-before-first-plan-card
  - reply-only-turn-does-not-call-tool-or-write
  - channel-has-no-dialogue-fallback-main-chain

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: plain conversation input "测试"
  - verify: assistant work-state skeleton is visible immediately after send, before model-authored reasoning arrives
  - wait_for: bounded AgentRun fast ack
  - wait_for: multiple purpose=author_reasoning provider chunks stream author_narrative_delta into UI before the first plan card
  - verify: the 46§9 reasoning area grows across at least two provider deltas before final source-bound narrative replaces the temporary stream
  - verify: author-facing UI shows the 46§9 phase strip, plan, reasoning stream, and result before developer details are expanded
  - expand: 工作详情
  - verify: provider execution telemetry is visible only after the user opens the developer detail row
  - wait_for: one author-safe AgentPlan draft containing context/frame/strategy/finalize plan_steps
  - wait_for: context result, no-tool strategy decision, and turn_result_ready completion event
  - wait_for: final TurnResult for the same run_id
  - verify: profile_ref is conversation_turn_v1 and no tool/write/adoption happened

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-conversation-turn-tauri

assertions:
  ui:
    - AI reply is visible in the real workbench
    - Assistant work-state skeleton appears immediately after the author sends the message
    - AgentRun panel reaches completed state
    - AgentRun panel renders 46§9 phase strip, plan, reasoning stream, and result in the author-facing surface
    - Provider execution details are collapsed by default and visible after opening 工作详情
  network:
    - parent user_message receives bounded run_id before final TurnResult
    - provider_progress author events carry at least two author_narrative_delta payloads before the first plan_drafted card for the same run_id
    - real UI reasoning text grows from the first delta to the cumulative provider delta prefix, observed from the external driver
    - agent_event includes one model plan_drafted payload containing context, frame, strategy, and finalize plan_steps for the same run_id
    - agent_event includes goal_understood, gate_decided, and turn_result_ready for context, no-tool strategy, and final response without app-authored observation narrative
    - agent_run_state completed budget reports steps=4, tool_calls=0, provider_calls=3, including profile routing, AgentPlan draft, and conversation frame model calls
    - final TurnResult carries agent_run.run_id and profile_ref=conversation_turn_v1
  data:
    - channel logs bounded run ack and never logs sync_turn fallback
    - no toolbox.execute event is emitted for the plain conversation turn
    - truthfulness reports tool_called=false, artifact_adopted=false, production_write_performed=false

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
