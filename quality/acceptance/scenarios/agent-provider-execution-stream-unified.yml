id: agent-provider-execution-stream-unified
title: Provider execution facts 进入对话 AgentRun developer telemetry
tier: nightly
status: active
surface: tauri
entrypoint: scripts/quality_accept.sh agent-provider-execution-stream-unified --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - provider-execution-has-single-runtime-architecture
  - provider-execution-facts-project-to-agent-activity
  - provider-activity-is-developer-telemetry
  - conversation-profile-does-not-use-historical-provider-progress-profile

setup:
  seed: none
  provider: slice_verify
  provider_variants:
    - lmstudio
    - deepseek
  provider_variant_commands:
    - bash scripts/quality_accept.sh agent-provider-execution-stream-unified --surface tauri --provider lmstudio
    - bash scripts/quality_accept.sh agent-provider-execution-stream-unified --surface tauri --provider deepseek

user_flow:
  - open: real Tauri workbench
  - send: plain conversation input that routes to conversation_turn_v1
  - verify: assistant work-state skeleton is visible immediately after send, before model-authored reasoning arrives
  - wait_for: fast ack with bounded run_id
  - verify: author_reasoning provider chunks drive live 46§9 reasoning text before the first plan card
  - verify: provider started, request_prepared, request_dispatched, chunk, response_received, and final_output facts are available through the scoped AgentRun activity API and render in 工作详情 for the same run_id
  - verify: provider activity carries provider_run_ref and provider_call_ref
  - verify: final TurnResult is consistent with the same AgentRun and records planner plus conversation provider calls

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
    - live_provider_http_jsonl_when_provider_variant
  artifact_dir: artifacts/slice-verify/agent-provider-execution-stream-unified-tauri
  provider_variant_artifact_dirs:
    lmstudio: artifacts/slice-verify/agent-provider-execution-stream-unified-tauri-lmstudio
    deepseek: artifacts/slice-verify/agent-provider-execution-stream-unified-tauri-deepseek

assertions:
  data:
    - profile_ref is conversation_turn_v1, not provider_progress_v1
    - developer provider_progress events are loaded from scoped AgentRun activity API, not from the author-facing websocket stream
    - assistant work-state skeleton appears immediately after the author sends the message
    - provider_progress events are visibility=developer
    - provider_progress events carry run_id, step_ref, provider_run_ref, and provider_call_ref
    - provider_progress events include provider_started, provider_request_prepared, provider_request_dispatched, provider_chunk, provider_response_received, and provider_final_output reason codes
    - provider chunk payload carries chunk index, chunk length, and accumulated length, but no generated text delta
    - author_reasoning chunk payload carries author_narrative_delta as the only author-facing generated text exception
    - 46§9 reasoning UI grows across at least two author_narrative_delta frames before the first plan card
    - provider progress UI shows prepared request, dispatched request, chunk receiving, and response received before final output
    - dialogue flow UI shows a model execution flow with request preparation, dispatch, output receiving, and result boundary phases
    - provider_progress payload does not expose raw prompt, system prompt, frame JSON, or assistant_message content
    - provider_progress purposes include author_reasoning and conversation
    - completed agent_run_state records seven provider calls, including the profile routing model call
    - live provider variants verify correlated POST /chat/completions logs for the same turn ids and provider id
    - DeepSeek live variant requires NOVEL_DEEPSEEK_API_KEY or DEEPSEEK_API_KEY and is blocked when neither exists

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false

known_limits:
  - Default provider remains deterministic slice_verify for stable nightly coverage.
  - Current live provider matrix scope is only local LM Studio and DeepSeek, per user decision. Other providers are intentionally not part of this CP until credentials exist.
