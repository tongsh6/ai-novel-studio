id: ua01-agent-bounded-roster-to-character-design
title: 复合角色任务启动 bounded AgentRun 并产出待采纳角色草稿
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh ua01-agent-bounded-roster-to-character-design --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - parent-turn-fast-ack-before-final-turn-result
  - agent-run-start-does-not-authorize-internal-tools
  - internal-agent-steps-re-gated-by-orchestrator
  - bounded-run-budget-counters-match-executed-steps
  - tentative-artifact-not-production
  - no-production-acceptance-hooks

setup:
  seed: none
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - create: isolated work through public work API
  - select: created work in the real workbench
  - send: compound author request asking to inspect current roster and then design a mirrored antagonist
  - verify: one model-drafted AgentPlan contains character_roster and character_design, then advances by mechanical cursor
  - observe: bounded AgentRun panel and author-visible run events
  - wait_for: final character_design TurnResult with pending character_seed artifact

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - turn_result
    - summary_json
  artifact_dir: artifacts/slice-verify/ua01-agent-bounded-roster-to-character-design-tauri

assertions:
  ui:
    - AgentRun activity panel is visible from real workbench events
    - completed status is visible after bounded run completes
    - artifact-created event is visible to the author
  network:
    - user_message returns bounded run ack before final TurnResult
    - agent_event and agent_run_state frames are broadcast over the workbench socket
    - final turn_result carries agent_run summary and character_design result
  data:
    - parent user_message starts bounded AgentRun without sync_turn fallback
    - plan_drafted target_tool_ref is character_roster and plan_steps are character_roster, character_design
    - roster and character_design internal steps each cross allow_tool gate
    - character_roster and character_design tools both execute
    - consumed budget is exactly two steps, two tool calls, and three provider calls: profile routing, AgentPlan draft, and character writer
    - generated character_seed remains tentative and requires author adoption
    - no production write or auto-adoption occurs

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
