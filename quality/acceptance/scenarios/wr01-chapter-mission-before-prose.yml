id: wr01-chapter-mission-before-prose
title: 正文写作前由模型推导本章使命并进入执行简报
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh wr01-chapter-mission-before-prose --surface tauri

contract:
  - docs/design/contracts/VS-00E-prose-execution-quality-contract-pack.md
  - docs/design/contracts/VS-00M-model-interaction-request-response-contract-pack.md
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/ui/46-state-and-feedback.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - mission-basis-refs-are-subset-of-mechanically-selected-input-refs
  - mission-is-design-state-and-performs-no-production-write
  - mission-narrative-bytes-come-from-the-same-native-call-author_reasoning
  - mission-enters-execution-brief-before-writer-call
  - rejected-mission-narrative-is-not-published-or-persisted
  - other-design-fields-and-author-mission-versions-are-protected

setup:
  seed: scripts/seed_wr01_chapter_mission.exs
  provider: slice_verify

user_flow:
  - open: real Tauri workbench through the existing native_b71_batch owner
  - send: the single frozen author message from authorVisibleScenarioSpec through the native chat input
  - wait_for: deterministic chapter_mission rejection followed by one corrected native call and prose_writing
  - verify: the complete accepted narrative is visible in this turn's 本轮创作过程 and the prose candidate stays tentative
  - open: Why using the public button
  - restore: close and relaunch the real app, then verify the same narrative and pending candidate without another provider call

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - llm_http_log
    - persistence_snapshot
    - turn_result
    - summary_json

assertions:
  ui:
    - current-turn native AX and window captures show the complete rendered mission narrative before and after restore
    - rejected fixture narrative never appears in observed live AX
    - prose candidate entry and its save action are visible and remain pending
  network:
    - one author send binds the native mission call, validation, mission_derived event and Writer to the same run
    - mission_derived preserves the full author_reasoning bytes and complete ProviderOutput source, hash and byte range
    - Why and restore add no provider calls or new author requests
  data:
    - the actual mission request targets the frozen work and chapter and its retained basis labels come from supplied materials
    - the later Writer request operation.execution_brief contains the accepted mission statement and retained items
    - only the proven model TENTATIVE chapter mission may change, while other design fields, author versions and production tables stay protected
    - invalid mission attempts have no accepted mission event or mission persistence; bounded failure does not imply zero Writer candidates

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false