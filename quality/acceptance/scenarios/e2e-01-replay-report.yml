id: e2e-01-replay-report
title: E2E-01 ReplayReport 六问结构化回放
tier: nightly
surface: tauri
default_provider: lmstudio
entrypoint: scripts/quality_accept.sh e2e-01-replay-report --surface tauri --provider lmstudio

contract:
  - docs/design/acceptance/e2e/E2E-01-full-chain.md
  - docs/design/acceptance/SCENARIO-BLUEPRINT.md
  - docs/design/contracts/VS-06-replay-surface-contract-pack.md
  - docs/design/adr/ADR-0017-replay-report-v3.md
  - docs/engineering/scenario-acceptance.md
  - docs/engineering/scenario-invariants.md
  - tasks/slices/E2E01-file-level-closure.md

invariants:
  - ReplayReport 必须由持久 DecisionTrace 构建，不得调用 provider。
  - planner-mediated tool turn 必须保留 frame / plan / decision / tool_trace / turn_result 链。
  - VS-06 六个必答问题必须有 answered / not_applicable / missing 的显式状态。
  - 缺关键 trace ref 时 `result_status` 不得冒充 complete。
  - 真实页面验收必须由外部 Tauri driver 操作可见聊天输入完成，不得新增产品验收感知逻辑。

setup:
  seed: scripts/seed_e2e_01_readonly_tool_trace.exs
  provider: lmstudio
  artifact_dir: artifacts/slice-verify/e2e-01-replay-report-tauri-lmstudio

user_flow:
  - 打开真实 Tauri 工作台。
  - 外部 driver 选中 seed 作品。
  - 在可见聊天输入框输入“查看当前角色列表”并点击发送。
  - 等待真实 LLM frame 与 MicroPlan 完成。
  - 验证 TurnResult 为 allow_tool / character_roster / succeeded，页面展示已确认角色且声明没有写入作品事实。
  - 外部 driver 以同一 turn_id 查询持久 DecisionTrace，并通过 `ReplayService.build_report/1` 生成 ReplayReport。
  - 验证 ReplayReport 未调用 provider、缺失引用为空、包含 frame / plan / decision / tool_trace / turn_result 链，并覆盖 VS-06 六问。

evidence:
  required:
    - artifacts/slice-verify/e2e-01-replay-report-tauri-lmstudio/summary.json
    - artifacts/slice-verify/e2e-01-replay-report-tauri-lmstudio/app-log.json
    - artifacts/slice-verify/e2e-01-replay-report-tauri-lmstudio/ui-frames.json
    - artifacts/slice-verify/e2e-01-replay-report-tauri-lmstudio/trace-query.json
    - artifacts/slice-verify/e2e-01-replay-report-tauri-lmstudio/lmstudio-log.json
    - artifacts/slice-verify/e2e-01-replay-report-tauri-lmstudio/e2e-01-replay-report-external-ui.png

assertions:
  ui:
    - visible_chat_input_sent_readonly_character_query
    - accepted_character_visible
    - no_execution_or_adoption_controls_visible
  network:
    - user_message_sent_from_target_work
    - turn_result_allow_tool_character_roster_received
  data:
    - replay_report_built_from_persisted_trace_without_provider_call
    - replay_report_answered_vs06_six_required_questions
    - replay_report_chain_includes_frame_plan_decision_tool_and_turn_result
    - trace_repository_list_by_turn_returned_tool_trace_ref
    - no_state_delta_or_artifact_refs
    - no_author_action_or_adoption_event
    - no_production_write
    - lmstudio_form_frame_and_micro_plan_called

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
