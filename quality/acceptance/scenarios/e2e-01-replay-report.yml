id: e2e-01-replay-report
title: E2E-01 ReplayReport 六问结构化回放（判断纪元只读工具步）
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh e2e-01-replay-report --surface tauri

contract:
  - docs/design/acceptance/e2e/E2E-01-full-chain.md
  - docs/design/contracts/VS-06-replay-surface-contract-pack.md
  - docs/design/adr/ADR-0017-replay-report-v3.md
  - tasks/slices/B40-judgment-era-acceptance-reanchor.md

invariants:
  - replay-report-built-from-persisted-trace-without-provider-call
  - replay-report-answers-vs06-required-questions
  - readonly-tool-step-does-not-write-production-state
  - product-code-carries-no-acceptance-hook

setup:
  seed: scripts/seed_e2e_01_readonly_tool_trace.exs
  provider: slice_verify
  artifact_dir: artifacts/slice-verify/e2e-01-replay-report-tauri

user_flow:
  - 打开真实 Tauri 工作台并选中 seed 作品。
  - 在可见聊天输入框输入“先看看当前已有角色阵容，然后设计一个与主角形成镜像冲突的主要反派。”并点击发送。
  - 判断纪元 bounded AgentRun 内部真实下发只读 `character_roster` 工具（Orchestrator allow_tool + Toolbox），中间步 turn_result 广播。
  - 外部 driver 以只读工具步 turn_id 查询产品持久 trace，并由 ReplayService 生成 no-provider ReplayReport。

evidence:
  required:
    - summary_json
    - app_jsonl
    - websocket_frames
    - replay_api_response
    - screenshot
  artifact_dir: artifacts/slice-verify/e2e-01-replay-report-tauri

assertions:
  ui:
    - visible_chat_input_sent_character_request_with_readonly_roster_step
    - accepted_character_visible
  network:
    - user_message_sent_from_target_work
    - readonly_character_roster_tool_turn_result_received
  data:
    - replay_report_built_from_persisted_trace_without_provider_call
    - replay_report_answered_vs06_six_required_questions
    - replay_report_chain_includes_frame_plan_decision_tool_and_turn_result
    - trace_repository_list_by_turn_returned_tool_trace_ref
    - readonly_roster_step_has_no_state_delta_or_artifact_refs
    - no_author_action_or_adoption_event
    - no_production_write

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
