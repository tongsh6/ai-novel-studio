id: agentic-loop-budget-deviation-replan
title: ADR-0023 D5 预算缺口恢复动作
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agentic-loop-budget-deviation-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0024-decision-surface-registry-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d5-budget-shortfall-stops-before-dispatch
  - budget-shortfall-turn-result-carries-author-actions
  - author-can-explicitly-expand-budget-within-hard-caps
  - no-auto-budget-expansion-or-bypass
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: plain conversation input "设计角色、大纲和正文改写计划，最多一步，测试预算余量不足"
  - wait_for: bounded AgentRun fast ack
  - wait_for: plan_drafted with more than one plan step
  - wait_for: awaiting_author with reason code plan_budget_shortfall
  - wait_for: TurnResult status awaiting_author with both budget recovery actions
  - click: "只执行下一步"
  - wait_for: budget_expanded with mode next_step, same run status running
  - verify: no plan_revised before the author action, no completed TurnResult before the author action

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-budget-deviation-replan-tauri

assertions:
  network:
    - parent user_message receives bounded run_id before terminal awaiting_author state
    - plan_drafted plan_steps has length > 1
    - awaiting_author reason_codes include budget_exhausted and plan_budget_shortfall
    - awaiting TurnResult carries agent_run_budget_next_step and agent_run_budget_remaining_plan
    - clicking next-step emits budget_expanded mode=next_step for the same run_id
    - same run state reaches running with max_steps >= 4 after the action
    - no plan_revised event is emitted before the author action
  data:
    - channel logs bounded run ack and never logs sync_turn fallback
    - no toolbox.execute and no completed TurnResult before the author action

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
