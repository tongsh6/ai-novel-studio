id: agentic-loop-budget-deviation-replan
title: ADR-0023 D5 预算缺口步骤选择
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agentic-loop-budget-deviation-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0024-decision-surface-registry-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d5-budget-shortfall-stops-before-extra-dispatch
  - planning-overhead-does-not-consume-execution-steps
  - budget-shortfall-turn-result-carries-step-choices
  - author-can-select-next-n-steps-within-hard-caps
  - no-auto-budget-expansion-or-bypass
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - click: '"本次只做一步" 作者步数约束（结构化 author_limits，非自然语言口令）'
  - send: plain conversation input "设计角色、大纲和正文改写计划，测试预算余量不足"
  - wait_for: bounded AgentRun fast ack
  - wait_for: plan_drafted with more than one plan step
  - wait_for: one plan step executes, then awaiting_author with plan_budget_shortfall
  - wait_for: TurnResult status awaiting_author with next-step, arbitrary-step, and remaining-plan choices
  - check: first two remaining plan steps in the selection panel
  - click: "执行选中的 2 步"
  - wait_for: budget_expanded with mode selected_steps, step_count 2, same run status running
  - wait_for: restored remaining-plan checkpoint TurnResult after selected steps complete
  - click: '"保存到大纲" on the checkpoint artifact'
  - wait_for: accept action result accepted
  - verify: no plan_revised and no completed TurnResult before the author action

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-budget-deviation-replan-tauri

assertions:
  network:
    - parent user_message receives bounded run_id before terminal awaiting_author state
    - plan_drafted plan_steps has length > 1
    - awaiting_author reason_codes include budget_exhausted and plan_budget_shortfall
    - awaiting TurnResult carries agent_run_budget_selected_steps and agent_run_budget_remaining_plan
    - execution_steps_before_action is 1 while total planning+execution steps is higher
    - checking two steps and clicking execute emits budget_expanded mode=selected_steps with step_count=2
    - same run state reaches running with max_steps >= 3 after the action
    - selected scope completion restores remaining plan and emits a new awaiting_author checkpoint
    - checkpoint includes pending adopted artifacts and their accept/discard actions
    - checkpoint artifact can be accepted through the real UI
    - no plan_revised event is emitted before the author action
  data:
    - channel logs bounded run ack and never logs sync_turn fallback
    - no toolbox.execute and no completed TurnResult before the author action

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
