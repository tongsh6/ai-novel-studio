id: agentic-loop-budget-deviation-replan
title: ADR-0023 D5 预算余量不足时先修订计划
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agentic-loop-budget-deviation-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d5-budget-shortfall-triggers-provider-sourced-replan
  - replan-budget-is-counted
  - planner-does-not-approve-tool-execution
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: plain conversation input expressing "先聊方向 / 不写正文 / 最多一步"
  - wait_for: bounded AgentRun fast ack
  - wait_for: provider-sourced plan_revised with reason code agentic_deviation:D5
  - wait_for: first revised context step completes
  - wait_for: run stops at awaiting_author after consuming one replan budget
  - verify: no tool call, no final TurnResult, no sync_turn fallback

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-budget-deviation-replan-tauri

assertions:
  network:
    - parent user_message receives bounded run_id before terminal awaiting_author state
    - plan_revised carries plan_version=2, evaluation_of_last.plan_holds=false, and provider_output narrative source
    - plan_revised reason_codes include agentic_deviation:D5
    - final agent_run_state records status=awaiting_author, steps=1, tool_calls=0, provider_calls=2, replans=1
  data:
    - channel logs bounded run ack and never logs sync_turn fallback
    - no toolbox.execute event is emitted
    - no final TurnResult is emitted for the budget-limited run

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
