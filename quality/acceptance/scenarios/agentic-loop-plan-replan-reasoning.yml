id: agentic-loop-plan-replan-reasoning
title: ADR-0023 D6 计划耗尽后修订计划再继续执行（判断纪元 prose 基座）
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agentic-loop-plan-replan-reasoning --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/adr/ADR-0025-judgment-driven-interactive-loop-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d6-plan-exhausted-without-completion-triggers-plan-revision
  - revised-plan-remains-execution-plan-not-tool-approval
  - replan-budget-is-counted
  - run-completes-into-pending-prose-artifact-without-auto-adoption

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: D6 fixture marker "UA01D6REPLAN" 触发的正文创作请求
  - wait_for: bounded AgentRun fast ack（profile_ref=prose_drafting_with_quality_v1）
  - wait_for: 模型起草的短计划只排 context 一步（short_plan_step_count=1）
  - wait_for: 判断②续行观察到计划耗尽（judgment_continuation_observed）
  - wait_for: 计划修订补足缺失的 prose 步后继续执行（consumed_replans>=1）
  - wait_for: run completed 并产出 pending prose 候选，不自动采纳、无生产写入

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-plan-replan-reasoning-tauri

assertions:
  ui:
    - 作者发送后立即出现 AI 工作态骨架，最终 AgentRun 面板 completed
    - 计划修订与继续执行在作者可见运行反馈中可读
  network:
    - parent user_message 在最终 TurnResult 前收到 bounded run_id
    - 初始计划只含 context 步（short_plan_step_count=1）
    - 判断②续行观察到短计划耗尽后触发计划修订并继续
    - agent_run_state：profile_ref=prose_drafting_with_quality_v1、consumed_replans>=1、pending prose artifact>=1
    - 最终 TurnResult 携带同一 run_id
  data:
    - channel 记录 bounded ack，且 log_sync_turn_count=0
    - 修订后的计划仍只是执行计划，不是工具批准
    - truthfulness 报告 tool_called=false、artifact_adopted=false、production_write_performed=false

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
