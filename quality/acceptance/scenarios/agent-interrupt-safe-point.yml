id: agent-interrupt-safe-point
title: AgentRun pause 停止当前 bounded run
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-interrupt-safe-point --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - author-can-pause-agent-run
  - pause-does-not-request-provider-execution-cancel
  - stale-run-command-does-not-silently-continue

setup:
  seed: none
  provider: slice_verify
  slow_marker: SU02SLOW

user_flow:
  - open: real Tauri workbench
  - send: slow bounded roster-to-character-design AgentRun request
  - verify: status, controls, and adjustment input share one workspace no wider than the 880px conversation rail
  - click: the single pause control in the integrated task workspace
  - wait_for: interrupt_requested event and paused run state for the same run_id
  - verify: the inline transcript keeps only status history; pause and resume reuse one stable action slot

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-interrupt-safe-point-tauri

assertions:
  network:
    - agent_command pause is sent from the real page with active run_id
    - command ack returns the same run_id
    - interrupt_requested and run_paused are broadcast for the same run_id
  data:
    - run state reaches paused
    - provider_execution_cancel_requested is false for pause
    - pause and resume are never shown simultaneously
    - the integrated task workspace width is at most 882px

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
