id: agent-no-progress-stop
title: AgentRun 重复探索同一处无新信息时停止等待作者（判断纪元语义）
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-no-progress-stop --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0025-judgment-driven-interactive-loop-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - loop-stops-on-true-no-progress
  - repeated-exploration-does-not-write
  - no-final-artifact-after-no-progress-stop

setup:
  seed: none
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: author request whose diagnosis marker makes the deterministic provider explore the same read-only archive face twice
  - wait_for: two exploration observations with the same tool + query and byte-identical observation payload
  - verify: AgentRun stops awaiting_author with reason_code no_progress (no third judgment, no final TurnResult, no production write)

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-no-progress-stop-tauri

assertions:
  ui:
    - 停止后作者可见运行反馈显示「未取得新进展」/等待作者回复语义
  network:
    - 两次 exploration_observed 为同 tool + 同 query 且观察字节相同（真重复）
    - 停等事件 reason_codes 含 no_progress
  data:
    - run state reaches awaiting_author with reason no_progress
    - consumed steps equals 3 (context step + two judgment steps)
    - consumed provider calls equals 4 (two judgment calls per round)
    - no tool executed, no final TurnResult broadcast, no production write

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
