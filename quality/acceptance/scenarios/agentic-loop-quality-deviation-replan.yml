id: agentic-loop-quality-deviation-replan
title: ADR-0023 D2 质量行动项触发计划修订
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agentic-loop-quality-deviation-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d2-quality-action-triggers-provider-sourced-replan
  - quality-finding-contract-fields-required
  - replan-budget-is-counted
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: prose request that produces a high confidence rule conflict quality finding
  - wait_for: bounded AgentRun fast ack
  - wait_for: artifact_created and quality_review observation
  - wait_for: pending candidate TurnResult whose AgentRun summary is awaiting_author
  - wait_for: provider-sourced plan_revised with reason code agentic_deviation:D2
  - wait_for: run stops at awaiting_author after consuming one replan budget

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-quality-deviation-replan-tauri

assertions:
  network:
    - plan_revised carries plan_version=2, evaluation_of_last.plan_holds=false, and provider_output narrative source
    - plan_revised reason_codes include agentic_deviation:D2
    - final agent_run_state records status=awaiting_author, steps=2, tool_calls=1, provider_calls=5, replans=1
  data:
    - quality finding includes required quality_gate_ref and validator_ref fields
    - candidate TurnResult exposes pending adoption and quality confirm policy evidence
    - channel logs bounded run ack and never logs sync_turn fallback
    - no completed AgentRun TurnResult is emitted after the quality deviation replan

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
