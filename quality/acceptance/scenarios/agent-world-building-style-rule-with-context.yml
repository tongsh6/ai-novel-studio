id: agent-world-building-style-rule-with-context
title: AgentRun 世界设定 Profile 生成待采纳写作规则草稿
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-world-building-style-rule-with-context --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/design/06-memory-context-and-trace.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - agent-step-regated-before-tool-dispatch
  - tentative-artifact-not-production
  - world-building-does-not-write-archive-before-adoption
  - world-building-intent-keeps-specific-artifact-type
  - agent-plan-is-not-micro-plan
  - agent-event-is-author-safe

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: world-building style-rule request "请制定一条后续创作必须遵守的写作规则和文风约束。"
  - wait_for: bounded AgentRun fast ack
  - wait_for: model-drafted AgentPlan containing context_assemble and world_building, context assembly, gated world_building tool step, and completion event
  - wait_for: completed agent_run_state
  - verify: final TurnResult is world_building with tentative style_rule_seed

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-world-building-style-rule-with-context-tauri

assertions:
  ui:
    - AgentRun panel reaches completed state
    - AgentRun work details show model execution flow and model-drafted plan text
    - AgentRun panel shows model plan drafting, context assembly, gate, world building, and completion summaries through author-safe stages
    - writing rule draft card remains visible as a tentative artifact
  network:
    - parent user_message receives bounded run_id before final TurnResult
    - profile routing transitions the same run from profile_routing_v1 to world_building_with_context_v1 before target plan execution
    - agent_event includes one model-drafted plan_drafted event whose plan_steps include context_assemble and world_building
    - agent_event includes evaluation_made, gate_decided, tool_started, tool_completed, artifact_created, and run_completed
    - final TurnResult carries agent_run.run_id and tool_result.tool_name=world_building
    - pending artifact is style_rule_seed and remains tentative
  data:
    - parent user_message starts bounded AgentRun without sync_turn fallback
    - world_building step is allow_tool before toolbox execution
    - consumed_budget reports steps=2, tool_calls=1, provider_calls=3, including profile routing, AgentPlan draft, and writer calls
    - no adoption or production write occurs before author action

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
