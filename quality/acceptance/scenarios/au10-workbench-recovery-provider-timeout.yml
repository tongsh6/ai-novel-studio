id: au10-workbench-recovery-provider-timeout
title: Provider 超时后工作台可恢复
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh au10-workbench-recovery-provider-timeout --surface tauri

contract:
  - docs/engineering/scenario-acceptance.md
  - docs/design/acceptance/author/AU-10-workbench-ui.md
  - docs/design/07-workbench-ui-contract.md
  - tasks/slices/AU10-workbench-recovery-disconnect-timeout.md
  - tasks/slices/AU10-file-level-closure.md

invariants:
  - provider-timeout-returns-author-readable-turn-result
  - provider-timeout-does-not-write-production-content
  - loading-clears-after-provider-timeout
  - next-turn-can-complete-after-timeout-recovery
  - no-product-acceptance-hooks

setup:
  seed: null
  provider: slice_verify

user_flow:
  - start: hanging OpenAI-compatible endpoint
  - configure: LM Studio runtime to the hanging endpoint
  - open: real Tauri workbench
  - input: author message
  - observe: timeout fallback turn_result
  - restore: slice_verify provider
  - input: following author message
  - observe: following turn completes without refreshing

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - ui_state
    - summary_json
  artifact_dir: artifacts/slice-verify/au10-workbench-recovery-provider-timeout-tauri

assertions:
  ui:
    - timeout message is visible
    - loading indicator clears after timeout
    - input remains available after timeout
    - following turn completes after timeout recovery
  network:
    - provider_gateway.complete.error carries reason_code timeout
    - timeout turn_result is delivered over the real channel
    - recovery turn_result is delivered after provider recovery
  data:
    - timeout creates no adopted artifact
    - timeout performs no production write
    - timeout and recovery prompts are both sent from the real workbench

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
