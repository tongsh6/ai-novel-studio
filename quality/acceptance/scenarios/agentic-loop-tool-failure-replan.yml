id: agentic-loop-tool-failure-replan
title: ADR-0023 D1 工具失败后判断②续行停等作者
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agentic-loop-tool-failure-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/adr/ADR-0025-judgment-driven-interactive-loop-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d1-tool-failure-observed-by-judgment-continuation
  - judgment-continuation-narrative-is-provider-sourced
  - tool-failure-does-not-become-run-failed-before-judgment
  - await-mode-does-not-consume-replan-budget
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: 正文创作请求 "写下一章正文草稿 AU04FAILTOOL"（writer provider 失败）
  - wait_for: bounded AgentRun fast ack（run_mode=bounded）
  - wait_for: run_started
  - wait_for: awaiting_author 事件，reason_codes 含 judgment_continuation 与 agentic_deviation:D1
  - verify: run 未在判断②前变成 run_failed，且无最终 TurnResult
  - verify: agent_run_state 记录 status=awaiting_author、profile_ref=prose_drafting_with_quality_v1、steps=4、tool_calls=1、provider_calls=8、replans=0

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-tool-failure-replan-tauri

assertions:
  ui:
    - 作者发送后立即出现 AI 工作态骨架，最终停在 awaiting_author 停等状态
    - 工具失败后作者可见运行反馈中不出现最终回复
  network:
    - parent user_message 在终态前收到 bounded run_id
    - awaiting_author reason_codes 含 judgment_continuation 与 agentic_deviation:D1
    - agent_run_state 记录 profile_ref=prose_drafting_with_quality_v1、status=awaiting_author、steps=4、tool_calls=1、provider_calls=8、replans=0
    - 无最终 TurnResult 广播
  data:
    - 判断②续行叙事来自 provider 输出（judgment continuation narrative provider-sourced）
    - 工具失败未在判断前变成 run_failed
    - channel 记录 bounded ack，且 log_sync_turn_count=0

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
