id: e2e-01-readonly-tool-trace
title: E2E-01 只读工具调度与 trace 回查
tier: nightly
surface: tauri
default_provider: lmstudio
entrypoint: scripts/quality_accept.sh e2e-01-readonly-tool-trace --surface tauri --provider lmstudio

contract:
  - docs/design/acceptance/e2e/E2E-01-full-chain.md
  - docs/design/acceptance/SCENARIO-BLUEPRINT.md
  - docs/design/03-capability-toolbox-contract.md
  - docs/design/contracts/VS-02-tool-provenance-contract-pack.md
  - docs/engineering/scenario-acceptance.md
  - docs/engineering/scenario-invariants.md
  - tasks/slices/E2E01-file-level-closure.md

invariants:
  - 作者自然输入“查看当前角色列表”必须通过 Planner tool_need 触发 MicroPlan，再由 Orchestrator 裁决 allow_tool。
  - character_roster 是低风险只读工具，不得触发 author_action、adoption、state_delta、artifact refs 或 production write。
  - ToolTrace refs 必须写入 DecisionTrace，并可由外部查询 `TraceRepository.list_by_turn` 回查同 turn。
  - 真实页面验收必须由外部 Tauri driver 操作可见聊天输入完成，不得新增产品验收感知逻辑。

setup:
  seed: scripts/seed_e2e_01_readonly_tool_trace.exs
  provider: lmstudio
  artifact_dir: artifacts/slice-verify/e2e-01-readonly-tool-trace-tauri-lmstudio

user_flow:
  - 打开真实 Tauri 工作台。
  - 外部 driver 选中 seed 作品。
  - 在可见聊天输入框输入“查看当前角色列表”并点击发送。
  - 等待真实 LLM frame 与 MicroPlan 完成。
  - 验证 TurnResult 为 allow_tool / character_roster / succeeded，页面展示已确认角色且声明没有写入作品事实。
  - 外部 driver 以同一 turn_id 查询 `TraceRepository.list_by_turn`，验证返回 tool_trace refs。

evidence:
  required:
    - artifacts/slice-verify/e2e-01-readonly-tool-trace-tauri-lmstudio/summary.json
    - artifacts/slice-verify/e2e-01-readonly-tool-trace-tauri-lmstudio/app-log.json
    - artifacts/slice-verify/e2e-01-readonly-tool-trace-tauri-lmstudio/ui-frames.json
    - artifacts/slice-verify/e2e-01-readonly-tool-trace-tauri-lmstudio/trace-query.json
    - artifacts/slice-verify/e2e-01-readonly-tool-trace-tauri-lmstudio/lmstudio-log.json
    - artifacts/slice-verify/e2e-01-readonly-tool-trace-tauri-lmstudio/e2e-01-readonly-tool-trace-external-ui.png

assertions:
  ui:
    - visible_chat_input_sent_readonly_character_query
    - accepted_character_visible
    - no_execution_or_adoption_controls_visible
  network:
    - user_message_sent_from_target_work
    - turn_result_allow_tool_character_roster_received
  data:
    - context_characters_loaded_from_character_dossier
    - toolbox_execute_character_roster_succeeded
    - no_state_delta_or_artifact_refs
    - no_author_action_or_adoption_event
    - no_production_write
    - trace_repository_list_by_turn_returned_tool_trace_ref
    - lmstudio_form_frame_and_micro_plan_called

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
