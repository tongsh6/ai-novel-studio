id: agent-awaiting-author-input-required
title: awaiting_author 必填补充：无裸继续、空输入禁发、刷新不重复
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-awaiting-author-input-required --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0024-decision-surface-registry-v3.md
  - docs/design/ui/46-state-and-feedback.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - awaiting-author-requires-concrete-input
  - no-bare-resume-while-awaiting-author
  - awaiting-input-steer-resumes-same-run
  - steer-message-persists-once-across-reload
  - command-authority-follows-runtime-state

setup:
  seed: none
  provider: slice_verify
  awaiting_marker: UA01AWAITSTEER

user_flow:
  - open: real Tauri workbench
  - send: an ambiguous request that requires an expansion direction
  - wait_for: awaiting_author state and the independent author_question TurnResult
  - verify: no bare 继续 action and a hint directing replies to the source question
  - click: 回复此问题
  - verify: empty and whitespace-only input keeps 发送回复 disabled and sends no request
  - send: a concrete expansion direction through "发送回复"
  - wait_for: plan_adjusted and run_resumed (resume_after_steer) for the same run_id
  - wait_for: completed state and the final TurnResult for the same run_id
  - reload: the workbench page
  - verify: the question is answered once, the reply is restored once on its original run, and reply controls are closed

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-awaiting-author-input-required-tauri

assertions:
  ui:
    - explicit question has no bare 继续 action
    - the hint reads 请在问题中选择或回复；下方输入会开始新的讨论。
    - 回复此问题 opens the labelled 对此问题的补充 composer
    - empty and whitespace-only input keeps 发送回复 disabled
    - reloaded transcript shows the reply and answered question without active reply controls
  network:
    - concrete reply is author_action author_choice bound to question_ref, source_turn_ref and the original run_id
    - blank replies send no author_action, agent_command or user_message
    - accepted reply increments goal version exactly once
    - plan_adjusted and run_resumed with resume_after_steer are broadcast for the same run_id
    - the same run_id reaches completed with a final TurnResult
  data:
    - exact reply text persists once under its immutable submission_id and original run_id
    - one question_ref is answered after reload; audit history may retain the earlier narration
    - no second AgentRun is created by the adjustment

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
