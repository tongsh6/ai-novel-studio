id: agent-provider-streaming-progress
title: Provider execution progress 进入 AgentRun author-safe 事件流
tier: nightly
status: blocked
blocked_reason: >-
  依赖的 ProviderProgress 专业调用（flow/profile/计划目录）已随 B27 CP3c 整体退役（无生产消费者）；
  本场景不得按关键词复活旧入口。re-anchor 建议：由 agent-provider-execution-stream-unified /
  agent-provider-execution-stream-error-author-safe 覆盖 developer telemetry，或另立长跑进度 slice 后重写 driver。
surface: tauri
entrypoint: scripts/quality_accept.sh agent-provider-streaming-progress --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/contracts/VS-02-tool-provenance-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - provider-execution-progress-is-author-safe
  - provider-execution-progress-does-not-expose-raw-prompt
  - provider-execution-progress-belongs-to-agent-run

setup:
  seed: none
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: request that triggers a provider execution progress step
  - wait_for: fast ack with run_id
  - verify: target profile first emits a model-drafted AgentPlan for provider_complete
  - verify: agent_event stream shows provider progress without raw prompt or secret
  - verify: final TurnResult is consistent with completed provider output

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-provider-streaming-progress-tauri

assertions:
  data:
    - provider_progress_v1 uses model-drafted AgentPlan before provider_complete execution
    - provider execution progress events carry run_id and step_ref
    - provider execution progress events are visibility=author
    - final agent_run_state records three provider calls: profile routing, AgentPlan draft, and provider progress call

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
