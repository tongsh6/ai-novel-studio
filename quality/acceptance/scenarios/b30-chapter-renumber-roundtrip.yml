id: b30-chapter-renumber-roundtrip
title: "B30：章节重编号 roundtrip（维护意图→可审阅映射→原子 seq 更新→刷新/消费者）"
tier: nightly
surface: tauri
default_provider: slice_verify
status_note: >-
  active（2026-10-25 CP4 注册）：外部 Tauri runner 驱动真实工作台（原生窗口 + 真实
  Phoenix/Vite 前端）复验 B30 结构维护闭环——真实输入→judgment
  `maintain_chapter_structure`→可审阅 old→new 变更计划（候选卡可见映射）→「保存到作品」
  →两阶段原子 seq 重编号（回执 committed_mapping/object_count/warnings）→刷新/TOC/
  按章阅读消费新 seq；交换/密集重排/重复确认幂等；负例澄清或可解释拒绝零写入；卷蓝图
  仅属 Volume、非法混排 type_mismatch 零行。证据边界：provider 为 slice_verify 确定性
  替身；真实模型意图归 CP4（同场景 strata 单槽 model_behavior 证据另行归档）。产品代码
  已提交（CP1–CP3），本场景不改产品代码、不新增验收感知逻辑。
entrypoint: bash scripts/quality_accept.sh b30-chapter-renumber-roundtrip --surface tauri
contract:
  - tasks/slices/B30-chapter-structure-maintenance.md §3–§5
  - docs/design/contracts/VS-00J-volume-structure-and-blueprint-contract-pack.md
  - docs/design/adr/ADR-0028-volume-structure-and-open-volume-action-v3.md
  - docs/design/adr/ADR-0019-adoption-status-transition-v3.md
  - tasks/slices/AU08-volume-structured-planning.md、B11A-volume-blueprint.md、B25-chapter-identity-unification.md
invariants:
  - I-B30-1 只重编号时 chapter_id 集合/章数/归卷/正文 hash/title 文本不变；seq 唯一。
  - I-B30-2 标题里的章号不是身份；维护请求不得以再生成大纲/新章冒充重编号。
  - I-B30-3 卷蓝图只属 Volume 设计态，不得物化为 Chapter 或占 seq。
  - I-B30-4 下游引用（章摘要/使命/进度/探索/写作坐标/判断索引）按稳定 ref 消费；换号不指向其他章。
  - I-B30-5 未采纳零写入；失败整体回滚；无目标/越界/重复编号/基线过期/不支持效果可解释拒绝。
setup:
  provider: slice_verify
  seed: scripts/seed_b30_chapter_structure.exs
  env_note: 隔离 test DB；确定性 provider 驱动判断绑定（维护能力本身零 provider）；真实模型意图归 CP4。
  trial_matrix:
    - T1 正例：真实输入「把第2卷章节编号理顺，内容不要动」→ judgment maintain_chapter_structure → 候选可见 old→new 映射（display_number_only）→ 保存到作品 → seq 原子更新；回执 committed_mapping/object_count/warnings；id/章数/归卷/正文 hash/title 文本/摘要引用不变。
    - T2 对调：「把第2卷的第11章和第12章的编号对调」→ 两阶段交换唯一冲突处理，id/正文不变。
    - T3 再次 dense：无重复移动/幂等（重复确认不再次移动）。
    - T4 刷新/消费者：刷新后新 seq 稳定、无重复采纳入口；TOC 顺序与 seq 一致；阅读按章点选可见对应正文。
    - T5 负例矩阵：多卷未点名/越界第九卷/重复编号 → 澄清或作者可见拒绝、零写入、不新增章、不回退 plot_outline/prose_writing。
    - T6 卷蓝图/类型边界：骨架作品真实规划卷章+规划下一卷采纳后蓝图只存 volumes.blueprint、Chapter 无蓝图行/不占 seq；seed harness 混排蓝图章块 type_mismatch 整体回滚零行。
user_flow:
  - open: 真实 Tauri runner（原生窗口 + 真实前后端）打开 seed 作品 A（两卷；第二卷 3 章标题第11/12/13章但 seq 3/4/5，各带 accepted 正文+摘要）。
  - send: 「把第2卷章节编号理顺，内容不要动。」
  - observe: 候选卡「章节重编号变更计划（3 章）」+ old→new 映射行 + title_number_mismatch warnings。
  - click: 「保存到作品」。
  - verify: seq 按映射原子更新；chapter id/章数/归卷/正文 hash/title 文本/摘要引用不变；回执 committed_mapping/object_count/warnings。
  - send: 「把第2卷的第11章和第12章的编号对调。」→ 保存到作品 → 两章 seq 交换、id/正文不变。
  - send: 再次「把第2卷章节编号理顺，内容不要动。」→ 保存到作品 → 无重复移动（幂等）。
  - refresh: 刷新页面 → 新 seq/正文 hash/章数稳定；无重复采纳入口；档案 TOC 顺序与 seq 一致；阅读按章点选可见对应正文。
  - send: 负例「把章节编号理顺，内容不要动」/「把第九卷章节编号理顺，内容不要动」/「把第2卷第11章和第11章的编号对调」→ 澄清/作者可见拒绝、零写入。
  - open: 作品 B（骨架）→ 规划卷章结构 → 保存到大纲 → 规划下一卷 → 保存到大纲 → 蓝图只在 volumes.blueprint、无蓝图 Chapter/不占 seq；seed harness type_mismatch 证据。
evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  extra_artifacts:
    - b30-cp4-evidence.json
    - b30-cp4-t1-change-plan.png
    - b30-cp4-reading-chapter-query.png
    - b30-cp4-final.png
  artifact_dir: artifacts/slice-verify/b30-chapter-renumber-roundtrip-tauri
assertions:
  ui:
    - 候选卡可见「章节重编号变更计划」与 old→new 映射/警告；「保存到作品」后回执可见（tool 无 writer/provider 调用）。
    - 刷新后档案/阅读目录按新 seq 展示；阅读按章点选显示对应正文。
    - 负例出现作者可见澄清/拒绝文案，不出现通用内部错误。
  network:
    - judgment.decided.done capability=maintain_chapter_structure；action_result 顶层 committed_mapping/object_count/warnings/adoption_effect=renumber_chapters。
    - 负例零写入（无生产写入/无候选/无新章）；不回退 plot_outline/prose_writing。
  data:
    - mapping 逐条：chapter_ref 不变、seq=to_seq；chapter_id 集合/章数/归卷/正文 hash/title 文本不变；seq 唯一。
    - chapter_summaries chapter_id/摘要 hash 不变；旧稿/摘要引用一致。
    - 卷蓝图：volumes.blueprint 存在；chapters 无「卷蓝图/蓝图」行、无占 seq；harness 混排 → `{:error, :type_mismatch}` 且章/卷 0 行。
  llm:
    - 确定性 provider 判断 prompt 含章节列表/预计卷数与作者原话；负例判断为 ask_author/capability_gap 或产品拒绝，不生成大纲候选。
anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
anti_hooks_verification: >-
  driver 只用页面可见语义（主输入/发送/打开档案/大纲与结构/规划卷章结构/规划下一卷/保存到作品/保存到大纲/
  阅读/按章点选）+ WS 帧 + app/llm JSONL + 隔离 DB 只读核对；未新增 testid/隐藏 metadata/验收开关。
prerequisites:
  - B30 CP1/CP2/CP3（能力/原子重编号/消费者迁移）与 VS-00J/ADR-0028/B25 已提交。
  - 真实模型正反例（strata/iq3_s 单槽）证据与确定性 product_state_chain 分开归档；不替代本场景 PASS。
known_not_closed:
  - 真实模型原话/改述由 CP4 单槽证据验证维护意图绑定；本场景为确定性 provider 产品链证据。
  - baseline 过期负例在真实页面无并行写入注入入口（由 CP1/CP2 单测与 adoption 守卫覆盖），本场景不做并行竞争注入；`unsupported_effect` 无自然语言表达入口，由单测覆盖。
  - stage 历史存量（两份第11章/卷蓝图误建章）未在本 seed 伪造；只读影响清单与清理需单独授权，不在本场景。
