id: agentic-loop-gate-deviation-replan
title: ADR-0023 D4 Orchestrator gate deny 后判断②续行停等作者
tier: nightly
surface: tauri
# 既有 runner 启动 Tauri；默认交互由 Chromium 驱动，实际证据层级为 browser。
driver: headless-chromium
entrypoint: scripts/quality_accept.sh agentic-loop-gate-deviation-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/adr/ADR-0025-judgment-driven-interactive-loop-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d4-gate-deny-observed-by-judgment-continuation
  - orchestrator-gate-is-not-bypassed
  - writer-provider-not-dispatched-after-gate-deny
  - await-mode-does-not-consume-replan-budget
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: 当前真实工作台（浏览器前后端集成）
  - send: 高风险正文请求 "写下一章正文草稿，高风险，确认后再执行"
  - wait_for: bounded AgentRun fast ack（profile_ref=prose_drafting_with_quality_v1）
  - wait_for: gate_decided 记录 decision_type=require_confirmation、first_blocking_gate=authority
  - wait_for: awaiting_author 事件，reason_codes 含 judgment_continuation 与 agentic_deviation:D4
  - verify: writer provider 未派发（无 tool_started / 工具执行）
  - verify: agent_run_state 记录 status=awaiting_author、steps=5、tool_calls=0、provider_calls=4、replans=0，且交付独立问题 TurnResult，不伪造创作候选

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-gate-deviation-replan-tauri

assertions:
  ui:
    - 作者发送后立即出现 AI 工作态骨架，最终停在 awaiting_author 停等状态
    - gate 拒绝后作者可见运行反馈中不出现最终回复
  network:
    - gate_decided 记录 decision_type=require_confirmation 与 first_blocking_gate=authority
    - awaiting_author reason_codes 含 judgment_continuation 与 agentic_deviation:D4
    - agent_run_state 记录 profile_ref=prose_drafting_with_quality_v1、status=awaiting_author、steps=5、tool_calls=0、provider_calls=4、replans=0
    - 独立问题 TurnResult 携 source/question/run 绑定及 author_choice 自由回复动作
  data:
    - gate deny 后 writer provider 未被派发（无工具执行）
    - Orchestrator gate 未被绕过
    - channel 记录 bounded ack，且 log_sync_turn_count=0

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
