id: au02-candidate-continuation
title: 候选方向继续讨论
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh au02-candidate-continuation --surface tauri

contract:
  - docs/engineering/scenario-acceptance.md
  - docs/design/acceptance/author/AU-02-explore.md
  - docs/design/acceptance/SCENARIO-BLUEPRINT.md

invariants:
  - candidate-selection-is-user-message-not-adoption-action
  - candidate-continuation-visible
  - candidate-panel-stays-within-assistant-reading-rail
  - candidate-panel-matches-pencil-surface-and-boundaries
  - accepted-candidate-continuation-collapses-source-panel
  - candidate-collapse-restores-from-session-transcript
  - candidate-selected-does-not-imply-candidate-adopted
  - no-production-write

setup:
  seed: null
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - input: 模糊小说创作方向
  - click: 发送
  - wait_for: candidate direction visible
  - click: 继续聊这个方向
  - observe: 下一轮 AI 回应

evidence:
  required:
    - screenshot
    - websocket_frames
    - turn_result
    - app_jsonl
    - ui_state
    - summary_json
  artifact_dir: artifacts/slice-verify/au02-candidate-continuation-tauri

assertions:
  ui:
    - candidate direction visible
    - continuation action visible
    - candidate panel matches the assistant output width and does not exceed the 700px reading rail
    - candidate panel uses the Pencil-defined surface, card boundary, and equal-weight outlined actions
    - accepted continuation collapses only the source candidate group into a titled disclosure
    - reload restores the disclosure from persisted candidate_selection and it can be expanded again
    - continuation does not require an adoption action
  network:
    - user_message sent with candidate_selection
    - generate_micro_plan remains false
    - turn_result received
    - author_action is not sent by continuation
  data:
    - candidate_selection references the source turn and candidate direction
    - no adoption decision is emitted for continuation
    - production_write_performed remains false

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
