id: agent-cancel-target-binding
title: AgentRun cancel 绑定 active run_id 并协作式取消
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-cancel-target-binding --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - author-can-cancel-agent-run
  - cancel-command-targets-active-run
  - provider-without-hard-cancel-degrades-honestly

setup:
  seed: none
  provider: slice_verify
  slow_marker: SU02SLOW

user_flow:
  - open: real Tauri workbench
  - send: slow bounded roster-to-character-design AgentRun request
  - click: visible cancel control in AgentRun panel
  - wait_for: interrupt_requested event and cancelled run state for the same run_id

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-cancel-target-binding-tauri

assertions:
  network:
    - agent_command cancel is sent from the real page with active run_id
    - command ack returns the same run_id
    - run_cancelled is broadcast for the same run_id
  data:
    - cancel does not target a stale or cross-run id
    - provider_hard_cancel_claimed is false

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
