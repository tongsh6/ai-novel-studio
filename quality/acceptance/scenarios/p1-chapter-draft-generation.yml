id: p1-chapter-draft-generation
title: 章节草稿生成闭环
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh p1-chapter-draft-generation --surface tauri

contract:
  - docs/design-v2/schemas/turn_result_v2.json
  - docs/engineering/scenario-acceptance.md
  - tasks/slices/P1-chapter-draft-generation.md

invariants:
  - I1-causal-binding
  - I2-input-variation
  - I3-nonce-propagation
  - tentative-artifact-not-production

setup:
  seed: scripts/seed_p1_chapter_draft_generation.exs
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - open: archive outline
  - click: generate draft for chapter 1
  - wait_for: tentative prose draft visible
  - open: reading mode

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - turn_result
    - summary_json
  artifact_dir: artifacts/slice-verify/p1-chapter-draft-generation-tauri

assertions:
  ui:
    - chapter draft action visible
    - tentative draft visible
    - reading mode does not show unaccepted draft as production
  network:
    - user_message or author_action sent
    - turn_result received
  data:
    - draft remains tentative until author adoption

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false

