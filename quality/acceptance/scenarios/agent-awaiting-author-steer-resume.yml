id: agent-awaiting-author-steer-resume
title: 等待作者补充后恢复同一 AgentRun 并完成
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-awaiting-author-steer-resume --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0024-decision-surface-registry-v3.md
  - docs/design/ui/46-state-and-feedback.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - author-can-steer-agent-run
  - awaiting-author-steer-resumes-same-run
  - natural-language-steer-does-not-create-second-run
  - stale-awaiting-decision-is-not-replayed
  - agent-event-is-not-turn-result

setup:
  seed: none
  provider: slice_verify
  awaiting_marker: UA01AWAITSTEER

user_flow:
  - open: real Tauri workbench
  - send: an ambiguous request that requires an expansion direction
  - wait_for: awaiting_author state and the independent author_question TurnResult
  - click: 回复此问题
  - verify: empty or whitespace-only replies keep 发送回复 disabled and send no request
  - send: a concrete expansion direction through "发送回复"
  - verify: author_action author_choice binds question_ref, source_turn_ref, run_id and immutable submission_id
  - wait_for: plan_adjusted and run_resumed for the same run_id
  - wait_for: completed TurnResult for the same run_id
  - verify: the completed assistant result appears after the adjustment message
  - reload: the workbench page
  - verify: the original question is answered once and the reply is restored once on the same run

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-awaiting-author-steer-resume-tauri

assertions:
  ui:
    - awaiting-author prompt is visible before the adjustment
    - the source question accepts the concrete author direction through 回复此问题
    - empty and whitespace-only replies keep 发送回复 disabled
    - final assistant result is rendered after the adjustment message
    - answered question has no reply controls and the final result is not the old question
  network:
    - reply is sent as author_action author_choice with exact question and run bindings
    - empty replies send no author_action, agent_command or user_message
    - no second channel user_message is sent for the adjustment
    - plan_adjusted and run_resumed are broadcast for the same run_id
  data:
    - accepted reply increments goal version exactly once and preserves exact adjustment text
    - one question_ref is answered and one submission_id is persisted after reload; audit history may retain the earlier narration
    - the same run_id reaches completed
    - no second AgentRun is created after the adjustment

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
