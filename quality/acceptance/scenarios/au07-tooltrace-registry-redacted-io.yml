id: au07-tooltrace-registry-redacted-io
title: ToolTrace registry snapshot 与 redacted I/O
tier: nightly
surface: tauri
default_provider: lmstudio
entrypoint: scripts/quality_accept.sh au07-tooltrace-registry-redacted-io --surface tauri --provider lmstudio

contract:
  - docs/design/acceptance/author/AU-07-trace-and-replay.md
  - docs/design/acceptance/e2e/E2E-01-full-chain.md
  - docs/design/acceptance/SCENARIO-BLUEPRINT.md
  - docs/design/contracts/VS-02-tool-provenance-contract-pack.md
  - docs/design/contracts/VS-06-replay-surface-contract-pack.md
  - docs/design/adr/ADR-0014-trace-redaction-v3.md
  - docs/design/adr/ADR-0017-replay-report-v3.md
  - docs/engineering/scenario-acceptance.md
  - docs/engineering/scenario-invariants.md
  - tasks/slices/AU07-file-level-closure.md

invariants:
  - ToolTrace 必须保留当时的 registry name/version/status/layer、input/output contract refs 和 grant summary。
  - ToolTrace 只能保存 redacted request/result summaries，不得保存 raw tool input/output payload。
  - ReplayReport 必须从持久 DecisionTrace 构建，不得调用 provider 或写生产状态。
  - 真实页面验收必须由外部 Tauri driver 操作可见聊天输入完成，不得新增产品验收感知逻辑。

setup:
  seed: scripts/seed_e2e_01_readonly_tool_trace.exs
  provider: lmstudio
  artifact_dir: artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri-lmstudio

user_flow:
  - 打开真实 Tauri 工作台。
  - 外部 driver 选中 seed 作品。
  - 在可见聊天输入框输入“查看当前角色列表”并点击发送。
  - 等待真实 LLM frame 与 MicroPlan 完成。
  - 验证 Orchestrator 允许低风险只读 `character_roster` 工具，Toolbox 成功返回，页面显示已确认角色且没有写入作品事实。
  - 外部 driver 以同一 turn_id 查询 `TraceRepository.list_by_turn`，并由 `ReplayService.build_report/1` 生成 no-provider ReplayReport。
  - 验证 ToolTrace ref 包含 registry snapshot、contract refs、grant summary、redacted request/result summaries 和 redaction boundary。

evidence:
  required:
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri-lmstudio/summary.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri-lmstudio/app-log.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri-lmstudio/ui-frames.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri-lmstudio/trace-query.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri-lmstudio/lmstudio-log.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri-lmstudio/au07-tooltrace-registry-redacted-io-external-ui.png

assertions:
  ui:
    - visible_chat_input_sent_readonly_character_query
    - accepted_character_visible
    - no_execution_or_adoption_controls_visible
  network:
    - user_message_sent_from_target_work
    - turn_result_allow_tool_character_roster_received
  data:
    - tool_trace_recorded_registry_snapshot_name_version_status_layer
    - tool_trace_recorded_input_output_contract_refs
    - tool_trace_recorded_grants_within_registry_without_write_grants
    - tool_trace_recorded_redacted_request_result_summaries_without_raw_payload
    - replay_report_tool_trace_chain_preserved_registry_and_redaction_boundary
    - replay_report_built_from_persisted_trace_without_provider_call
    - no_state_delta_or_artifact_refs
    - no_author_action_or_adoption_event
    - no_production_write
    - lmstudio_form_frame_and_micro_plan_called

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
