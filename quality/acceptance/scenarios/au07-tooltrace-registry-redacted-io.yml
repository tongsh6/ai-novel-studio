id: au07-tooltrace-registry-redacted-io
title: ToolTrace registry snapshot 与 redacted I/O（判断纪元只读工具步）
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh au07-tooltrace-registry-redacted-io --surface tauri

contract:
  - docs/design/acceptance/author/AU-07-trace-and-replay.md
  - docs/design/acceptance/e2e/E2E-01-full-chain.md
  - docs/design/contracts/VS-02-tool-provenance-contract-pack.md
  - docs/design/contracts/VS-06-replay-surface-contract-pack.md
  - docs/design/adr/ADR-0014-trace-redaction-v3.md
  - docs/design/adr/ADR-0017-replay-report-v3.md
  - tasks/slices/B40-judgment-era-acceptance-reanchor.md

invariants:
  - tool-trace-keeps-registry-name-version-status-layer-contract-refs-and-grant-summary
  - tool-trace-stores-only-redacted-request-result-summaries
  - replay-report-built-from-persisted-trace-without-provider-call
  - readonly-tool-step-does-not-write-production-state
  - product-code-carries-no-acceptance-hook

setup:
  seed: scripts/seed_e2e_01_readonly_tool_trace.exs
  provider: slice_verify
  artifact_dir: artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri

user_flow:
  - 打开真实 Tauri 工作台并选中 seed 作品。
  - 在可见聊天输入框输入“先看看当前已有角色阵容，然后设计一个与主角形成镜像冲突的主要反派。”并点击发送。
  - 判断①判 character_design 执行；bounded AgentRun 内部第一步真实下发只读 `character_roster` 工具（Orchestrator 12 门 allow_tool + Toolbox），中间步 turn_result 广播到工作台。
  - 外部 driver 以该只读工具步 turn_id 查询产品持久 trace，并由 `ReplayService.build_report/1` 生成 no-provider ReplayReport。
  - 验证 ToolTrace ref 包含 registry snapshot、contract refs、grant summary、redacted request/result summaries 和 redaction boundary；本轮不采纳后续角色候选。

evidence:
  required:
    - summary_json
    - app_jsonl
    - websocket_frames
    - replay_api_response
    - screenshot
  required_artifacts:
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri/summary.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri/app-log.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri/ui-frames.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri/trace-query.json
    - artifacts/slice-verify/au07-tooltrace-registry-redacted-io-tauri/au07-tooltrace-registry-redacted-io-external-ui.png

assertions:
  ui:
    - visible_chat_input_sent_character_request_with_readonly_roster_step
    - accepted_character_visible
  network:
    - user_message_sent_from_target_work
    - readonly_character_roster_tool_turn_result_received
  data:
    - tool_trace_recorded_registry_snapshot_name_version_status_layer
    - tool_trace_recorded_input_output_contract_refs
    - tool_trace_recorded_grants_within_registry_without_write_grants
    - tool_trace_recorded_redacted_request_result_summaries_without_raw_payload
    - replay_report_tool_trace_chain_preserved_registry_and_redaction_boundary
    - replay_report_built_from_persisted_trace_without_provider_call
    - readonly_roster_step_has_no_state_delta_or_artifact_refs
    - no_author_action_or_adoption_event
    - no_production_write

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
