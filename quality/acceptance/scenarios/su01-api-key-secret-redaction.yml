id: su01-api-key-secret-redaction
title: API Key 配置流与 secret redaction
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh su01-api-key-secret-redaction --surface tauri

contract:
  - docs/design/acceptance/system/SU-01-model-provider.md
  - docs/design/tech-stack/05-desktop.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - provider-api-key-not-returned-by-options
  - provider-api-key-not-written-to-browser-settings
  - provider-api-key-not-visible-in-ui
  - provider-api-key-not-leaked-to-business-or-backend-logs
  - no-product-acceptance-hooks

setup:
  seed: null
  provider: slice_verify

user_flow:
  - open: real workbench model settings
  - select: DeepSeek provider
  - input: fake API key into password field
  - refresh: model list through the production DeepSeek adapter with a harnessed external HTTP boundary
  - test: connection succeeds
  - save: provider selection
  - observe: provider/model badge shows DeepSeek model

evidence:
  required:
    - screenshot
    - app_jsonl
    - backend_log
    - ui_state
    - summary_json
  artifact_dir: artifacts/slice-verify/su01-api-key-secret-redaction-tauri

assertions:
  ui:
    - API key field is password input
    - connection test succeeds before save
    - saved provider badge shows DeepSeek and selected model
    - visible text does not contain the API key
  network:
    - provider options marks api_key_configured true without returning the secret
    - model list is loaded through the DeepSeek adapter HTTP boundary
  data:
    - browser fallback settings do not contain the API key
    - business JSONL logs do not contain the API key
    - backend request logs do not contain the API key

known_limits:
  - Current external driver controls the browser-side workbench, not the Tauri WebView, so this scenario does not prove macOS Keychain write/read. Keep SC-SU01-C3 Keychain WebView evidence open.

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
