id: q3b-capability-gap-honest-reply
title: 真实能力缺口的诚实回复与可行路径
tier: nightly
surface: tauri
# B26 原文登记已有真实承接；旧 D8 来源回归由 q3c/B26 业务矩阵继续保护。
# 默认交互是 Chromium 集成；原生证明见 b26-business-output-roundtrip。
driver: headless-chromium
entrypoint: scripts/quality_accept.sh q3b-capability-gap-honest-reply --surface tauri
real_lmstudio_entrypoint: scripts/tauri_slice_verify.sh --real-lmstudio q3b-capability-gap-honest-reply

contract:
  - docs/engineering/scenario-acceptance.md
  - docs/design/contracts/VS-00-reply-only-contract-pack.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/notes/2026-08-30-stage-session-archive-loop.md
  - tasks/slices/Q3B-capability-gap-exit.md

invariants:
  - capability-gap-produces-honest-reply-not-readonly-execute
  - gap-reply-explains-nearest-path-without-direction-actions
  - no-production-write

setup:
  seed: null
  provider: slice_verify

user_flow:
  - open: 当前真实工作台（浏览器前后端集成）
  - input: 作者要求把已有角色的叙事身份从配角改为主角（当前尚无该维护能力）
  - click: 发送
  - observe: 自然回复显式承认缺少主档案身份修改能力；不使用角色演化冒充修改，不产生创作方向卡，可先讨论方案
  - do_not_see: execution card / confirmation card / adoption decision

evidence:
  required:
    - screenshot
    - websocket_frames
    - turn_result
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/q3b-capability-gap-honest-reply-tauri

assertions:
  ui:
    - honest gap reply is visible (admits missing write capability)
    - nearest-path guidance is visible in the reply; no choose_candidate action
    - execution or confirmation card is not visible
  network:
    - source user_message uses generate_micro_plan false
    - judgment.decided.done has frame_type capability_gap with candidate_count = 0
    - author_action is not sent
    - action_result is not received
  data:
    - no tool_result is emitted
    - no adoption decision is emitted
    - production_write_performed remains false

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
