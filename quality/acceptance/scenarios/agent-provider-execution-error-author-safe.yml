id: agent-provider-execution-error-author-safe
title: Provider execution error facts 进入对话 AgentRun author-safe 工作轨迹
tier: nightly
status: active
surface: tauri
entrypoint: scripts/quality_accept.sh agent-provider-execution-error-author-safe --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - provider-execution-has-single-runtime-architecture
  - provider-execution-error-is-a-provider-execution-fact
  - provider-error-activity-is-author-safe
  - conversation-profile-does-not-use-historical-provider-progress-profile

setup:
  seed: none
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: plain conversation input that routes to conversation_turn_v1 and triggers provider_error in test-support provider
  - wait_for: fast ack with bounded run_id
  - verify: provider started and error facts project as provider_progress agent_event entries for the same run_id
  - verify: provider activity carries provider_run_ref and provider_call_ref
  - verify: final TurnResult is a safe fallback reply and records no tool call, no artifact adoption, and no production write

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-provider-execution-error-author-safe-tauri

assertions:
  data:
    - profile_ref is conversation_turn_v1, not provider_progress_v1
    - provider_progress events are visibility=author
    - provider_progress events carry run_id, step_ref, provider_run_ref, and provider_call_ref
    - provider_progress events include provider_started and provider_error reason codes
    - provider_progress payload does not expose raw prompt, system prompt, provider raw error payload, or assistant_message content
    - provider_progress purposes include planner and conversation
    - completed agent_run_state records six provider calls
    - final TurnResult is safe fallback with no tool call, no adoption, and no production write

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
