id: au09-adopt-setting-recall
title: 档案伏笔规则采纳为可召回设定
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh au09-adopt-setting-recall --surface tauri

contract:
  - docs/design/acceptance/author/AU-09-story-memory.md
  - docs/design/acceptance/author/AU-05-artifact-adoption.md
  - docs/design/06-memory-context-and-trace.md
  - tasks/slices/AU09-archive-memory-roundtrip.md

invariants:
  - tentative-setting-requires-adoption-before-memory
  - explicit-setting-artifact-type-drives-governed-memory-type
  - adopted-setting-recalls-as-confirmed-memory
  - no-production-acceptance-hooks

setup:
  seed: scripts/seed_p1_chapter_draft_generation.exs
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - open: archive foreshadowing and rules tabs
  - click: 新增伏笔
  - adopt: generated foreshadowing artifact
  - click: 新建规则
  - adopt: generated rule artifact
  - reopen: archive tabs
  - input: related author message
  - observe: adopted setting recalls and why explains source

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - turn_result
    - action_result
    - summary_json
  artifact_dir: artifacts/slice-verify/au09-adopt-setting-recall-tauri

assertions:
  ui:
    - AI generated setting artifacts from real archive actions
    - adopted setting is visible in foreshadowing archive tab after reopen
    - adopted rule is visible in rules archive tab after reopen
    - why panel shows confirmed memory as author-safe source
  network:
    - author_action adoption is sent from the real workbench
    - get_foreshadowing and get_rules read current work data after adoption
  data:
    - setting artifact type is explicit foreshadowing_seed or rule seed
    - adopted setting becomes confirmed recallable governed memory
    - later context assembly includes the adopted setting

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
