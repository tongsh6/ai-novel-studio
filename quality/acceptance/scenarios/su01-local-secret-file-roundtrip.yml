id: su01-local-secret-file-roundtrip
title: 真实 Tauri WebView 本地密钥文件写读与脱敏
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh su01-local-secret-file-roundtrip --surface tauri

contract:
  - docs/design/acceptance/system/SU-01-model-provider.md
  - docs/design/tech-stack/05-desktop.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - provider-api-key-written-through-tauri-webview-command
  - provider-secrets-json-written-with-owner-only-permissions
  - provider-api-key-not-returned-by-options
  - provider-api-key-not-visible-in-ui-or-logs
  - product-code-added-no-acceptance-hooks

setup:
  seed: null
  provider: slice_verify
  desktop_profile: slice-verify
  secret_storage: profile-scoped-provider-secrets-json

user_flow:
  - open: real Tauri WebView workbench model settings
  - select: DeepSeek provider
  - input: fake API key into password field
  - refresh: model list through the production DeepSeek adapter with a harnessed external HTTP boundary
  - save: provider selection and API key through Tauri command
  - restart: Tauri app after backend runtime reset
  - observe: new WebView restores DeepSeek provider from Tauri preferences plus provider-secrets.json

evidence:
  required:
    - screenshot
    - app_jsonl
    - backend_log
    - ui_state
    - provider_secrets_metadata
    - summary_json
  artifact_dir: artifacts/slice-verify/su01-local-secret-file-roundtrip-tauri

assertions:
  ui:
    - model settings opens from the real Tauri WebView
    - saved provider badge shows DeepSeek and selected model after restart
    - visible text does not contain the API key
  native:
    - provider-secrets.json exists under the isolated desktop profile config dir
    - provider-secrets.json is written with owner-only 0600 permissions on Unix
    - Tauri restart restores provider runtime from preferences plus provider-secrets.json
  data:
    - provider options marks api_key_configured true without returning the secret
    - preferences file stores non-secret provider state only
    - business JSONL logs and backend logs do not contain the API key

known_limits:
  - This scenario runs on macOS because the current external native WebView driver uses CGEvent and Accessibility APIs.
  - It proves the current desktop implementation uses a profile-scoped local secret file, not OS Keychain / Credential Manager / Secret Service.

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
