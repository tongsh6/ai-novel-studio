id: p1-chapter-adoption-reading
title: 已采纳章节正文进入阅读投影
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh p1-chapter-adoption-reading --surface tauri

contract:
  - docs/engineering/scenario-acceptance.md
  - docs/design/acceptance/author/AU-08-reading-mode.md
  - docs/design/acceptance/author/AU-05-artifact-adoption.md
  - docs/design/contracts/VS-04-adoption-boundary-contract-pack.md
  - docs/design/adr/ADR-0016-projection-hint-ui-v3.md
  - tasks/slices/P1-chapter-adoption-reading.md

invariants:
  - accepted-prose-materializes-reading-projection
  - pending-prose-does-not-count-as-production
  - reading-projection-uses-current-work-id
  - displayed-word-count-derived-from-visible-prose
  - projection-ref-stale-status-is-visible
  # B21：多场计划下首次 append 落的是整章正文，场身份=章——计划第 1 场名不得成为
  # 场景行标题，也不得在阅读区渲染成假的「第 1 场」标题。
  - first-append-whole-chapter-scene-title-is-placeholder

setup:
  seed: scripts/seed_p1_chapter_draft_generation.exs
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - click: 打开档案
  - click: 生成正文草稿
  - wait_for: pending prose draft visible
  - click: 保存为章节正文
  - open: 阅读模式
  - observe: TOC、章节正文、全书有效字数、本章有效字数和投影过期提示来自真实 Channel 投影

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - turn_result
    - action_result
    - summary_json
  artifact_dir: artifacts/slice-verify/p1-chapter-adoption-reading-tauri

assertions:
  ui:
    - prose draft is accepted from the real workbench action
    - reading mode shows adopted chapter prose
    - total and chapter effective word counts are visible
    - stale projection banner and refresh button are visible after projection_ref STALE
    - planned first scene title and generated scene placeholder are not rendered as fake reading headings
  network:
    - author_action accept is sent from the real workbench
    - accepted turn_result contains resolved adoption state
    - get_toc and get_chapter_content return current work projection data
    - get_toc exposes the two planned scenes of chapter 1
    - get_chapter_content scene row title stays the generated placeholder
  data:
    - artifact_adopted is true
    - production_write_performed is true
    - reading projection contains accepted prose only
    - displayed word count equals effective count of visible adopted prose
    - first append scene row title is the generated placeholder, not the planned first scene title
    - app log 噪声门禁（ADR-0018 §6）：正常路径 base turn 行数 ≤45 且 0 error 级（summary.log_noise）

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
