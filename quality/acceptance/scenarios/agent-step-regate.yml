id: agent-step-regate
title: 每个 AgentStep 重新经过 Orchestrator gate
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-step-regate --surface tauri
canonical_driver: ua01-agent-bounded-roster-to-character-design

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - each-agent-step-re-enters-orchestrator
  - agent-does-not-directly-call-toolbox
  - planner-does-not-approve-its-own-execution

setup:
  seed: none
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: compound roster then character design request
  - wait_for: bounded run completion
  - verify: parent user_message returns bounded run_id and app log records allow_tool for both internal steps

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-step-regate-tauri

assertions:
  data:
    - parent user_message starts bounded AgentRun without sync_turn fallback
    - character_roster step has allow_tool decision before Toolbox execution
    - character_design step has allow_tool decision before Toolbox execution
    - each internal step records ordered 12-gate lineage with gate_order_version adr-0005-v1
    - no gate outcome on an allow_tool step is soft_block/hard_block/recoverable_failure
    - budget gate evaluates the real AgentRun remaining budget (pass_with_note run_budget_remaining)
    - trace readiness gate evaluates the real persistence channel (pass)
    - step TurnResult trace_summary carries gate_order_version and 12 gate results (DecisionTrace gate lineage)
    - two internal steps use distinct decision lineage (decision_id) and broadcast a gate_decided event each

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
