id: agent-provider-cancel-honest-boundary
title: Provider cancel 通过统一 ProviderExecution 取消
tier: nightly
status: active
surface: tauri
entrypoint: scripts/quality_accept.sh agent-provider-cancel-honest-boundary --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - cancel-command-is-bound-to-run-id
  - provider-execution-cancel-is-single-runtime-path
  - completed-output-is-not-deleted-or-adopted

setup:
  seed: none
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: request that starts a long provider step
  - click: cancel current AgentRun
  - verify: cancel event binds the active run_id
  - verify: UI and trace report provider_execution_cancel until terminal cancelled state

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-provider-cancel-honest-boundary-tauri

assertions:
  data:
    - cancel command includes run_id
    - interrupt event records provider_execution_cancel_requested
    - final state records provider_execution_cancelled
    - ProviderExecution cancellation stays in one runtime path

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
