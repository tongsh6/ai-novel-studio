id: agentic-loop-deterministic-gap-replan
title: ADR-0023 D7 确定性缺口触发计划修订
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agentic-loop-deterministic-gap-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d7-deterministic-gap-triggers-provider-sourced-replan
  - missing-policy-blocks-writer-dispatch
  - planner-does-not-approve-tool-execution
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: prose continuation request for a missing named chapter
  - wait_for: bounded AgentRun fast ack
  - wait_for: missing policy blocks writer dispatch
  - wait_for: provider-sourced plan_revised with reason code agentic_deviation:D7
  - wait_for: run stops at awaiting_author after consuming one replan budget

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-deterministic-gap-replan-tauri

assertions:
  network:
    - plan_revised carries plan_version=2, evaluation_of_last.plan_holds=false, and provider_output narrative source
    - plan_revised reason_codes include agentic_deviation:D7
    - final agent_run_state records status=awaiting_author, steps=2, tool_calls=0, provider_calls=3, replans=1
  data:
    - writer provider is not dispatched after missing policy block
    - tool_completed event count is zero and toolbox execute log count is zero
    - channel logs bounded run ack and never logs sync_turn fallback
    - no final TurnResult is emitted

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
