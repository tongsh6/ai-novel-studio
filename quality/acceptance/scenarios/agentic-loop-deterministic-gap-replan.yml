id: agentic-loop-deterministic-gap-replan
title: ADR-0023 D7 确定性缺口后判断②续行停等作者
tier: nightly
surface: tauri
# 既有 runner 启动 Tauri；默认交互由 Chromium 驱动，实际证据层级为 browser。
driver: headless-chromium
entrypoint: scripts/quality_accept.sh agentic-loop-deterministic-gap-replan --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/adr/ADR-0025-judgment-driven-interactive-loop-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - d7-deterministic-gap-observed-by-judgment-continuation
  - missing-policy-blocks-writer-dispatch
  - no-tool-completed-events
  - await-mode-does-not-consume-replan-budget
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: 当前真实工作台（浏览器前后端集成）
  - send: 正文续写请求 "续写第99章正文"（缺章确定性缺口）
  - wait_for: bounded AgentRun fast ack（profile_ref=prose_drafting_with_quality_v1）
  - wait_for: missing policy 阻断 writer 派发
  - wait_for: awaiting_author 事件，reason_codes 含 judgment_continuation 与 agentic_deviation:D7
  - verify: agent_run_state 记录 status=awaiting_author、steps=5、tool_calls=0、provider_calls=4、replans=0
  - verify: tool_completed 事件数为 0 且 toolbox execute 日志数为 0，交付独立问题 TurnResult 与自由回复动作

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agentic-loop-deterministic-gap-replan-tauri

assertions:
  ui:
    - 作者发送后立即出现 AI 工作态骨架，最终停在 awaiting_author 停等状态
    - 确定性缺口阻断执行后显示模型问题及可操作的自由回复入口
  network:
    - awaiting_author reason_codes 含 judgment_continuation 与 agentic_deviation:D7
    - agent_run_state 记录 profile_ref=prose_drafting_with_quality_v1、status=awaiting_author、steps=5、tool_calls=0、provider_calls=4、replans=0
    - 独立问题 TurnResult 携 source/question/run 绑定及 author_choice 自由回复动作
  data:
    - missing policy 阻断 writer provider 派发
    - tool_completed 事件数为 0 且 toolbox execute 日志数为 0
    - channel 记录 bounded ack，且 log_sync_turn_count=0

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
