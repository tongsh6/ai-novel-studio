id: agent-plan-native-tool-calling-protocol
title: ADR-0023 CP4 AgentPlan 原生 tool calling 协议（判断纪元 prose 基座）
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-plan-native-tool-calling-protocol --surface tauri

contract:
  - docs/design/adr/ADR-0023-agentic-loop-plan-driven-execution-v3.md
  - docs/design/adr/ADR-0025-judgment-driven-interactive-loop-v3.md
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - agent-plan-draft-structure-comes-from-native-tool-call
  - judgment-continuation-structure-comes-from-native-tool-call
  - native-tool-call-arguments-are-not-exposed-to-developer-telemetry
  - run-continues-to-pending-prose-artifact-after-judgment-continuation
  - no-acceptance-hook-in-production

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: D6 fixture marker "UA01D6REPLAN" 触发的正文创作请求
  - wait_for: bounded AgentRun fast ack（profile_ref=prose_drafting_with_quality_v1）
  - wait_for: 模型起草的短计划只排 context 一步（short_plan_step_count=1）
  - wait_for: 判断②续行观察计划耗尽并继续（judgment_continuation_observed=true，consumed_replans>=1）
  - query: scoped AgentRun activity API for the same work/session/turn
  - verify: provider final_output telemetry 暴露 native_tool_call_names，含 agent_plan_draft 与 continuation_decision
  - verify: run completed 并产出 pending prose 候选，不自动采纳、无生产写入

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-plan-native-tool-calling-protocol-tauri

assertions:
  ui:
    - 作者发送后立即出现 AI 工作态骨架，最终 AgentRun 面板 completed
    - 计划步骤、判断续行与最终正文候选在作者可见运行反馈中可读
  network:
    - parent user_message 在最终 TurnResult 前收到 bounded run_id
    - 初始计划只含 context 步（short_plan_step_count=1）
    - 判断②续行后继续执行到 pending prose artifact（consumed_replans>=1）
    - scoped AgentRun activity API 返回同一 run 的 provider final_output telemetry（HTTP 200）
    - provider final_output telemetry 含 native_tool_call_count 与 native_tool_call_names
  data:
    - native_tool_call_names 含 agent_plan_draft 与 continuation_decision
    - native tool call arguments / plan steps / target_tool_ref 不出现在 developer telemetry
    - channel 记录 bounded ack，且 log_sync_turn_count=0
    - 最终 TurnResult 的 truthfulness 报告 artifact_adopted=false、production_write_performed=false（正文候选保持 pending）

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
