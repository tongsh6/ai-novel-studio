id: agent-provider-execution-activity-restored
title: Provider execution activity 与 usage 从持久事实异步恢复到对话流
tier: nightly
status: active
surface: tauri
entrypoint: scripts/quality_accept.sh agent-provider-execution-activity-restored --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - provider-execution-has-single-runtime-architecture
  - session-restore-keeps-agent-run-activity-summary-only
  - provider-activity-is-lazy-loaded-from-agent-event-log
  - provider-usage-is-lazy-loaded-from-provider-run-log
  - provider-activity-is-developer-telemetry
  - replay-or-restore-does-not-recall-provider

setup:
  seed: none
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: plain conversation input that routes to conversation_turn_v1
  - wait_for: provider started and final_output facts project as developer provider_progress events
  - query: real session snapshot for the persisted assistant turn_result
  - verify: persisted turn_result.agent_run is summary-only and marks activity_loaded=false
  - query: scoped AgentRun activity API by work_id / session_id / turn_id
  - verify: AgentRun activity API returns developer provider_progress events without recalling provider
  - verify: AgentRun activity API returns persisted provider usage summaries for author_reasoning and conversation calls
  - reload: real workbench
  - verify: restored assistant dialogue flow initially keeps work details collapsed
  - click: work details summary inside the same assistant dialogue flow
  - verify: expanded work details show provider execution activity, ProviderRun event replay, output summary, and no-provider-recall boundary

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-provider-execution-activity-restored-tauri

assertions:
  data:
    - restored turn_result.agent_run keeps events and provider_runs empty with activity_loaded=false
    - scoped AgentRun activity API returns HTTP 200 for the original work/session/turn
    - scoped AgentRun activity API returns provider_started and provider_final_output events
    - scoped AgentRun activity API carries provider_run_ref and provider_call_ref
    - scoped AgentRun activity API returns provider_run_ref, provider_call_ref, purpose, status, output_type, content_length, events, output summary, and usage totals
    - scoped AgentRun activity API preserves author_reasoning and conversation purposes
    - scoped AgentRun activity API does not expose raw prompt, system prompt, assistant raw content, or provider raw payload
    - page reload restores the same assistant dialogue flow with work details collapsed
    - author expansion lazy-loads provider execution activity into the same assistant dialogue flow
    - expanded work details restore ProviderRun replay UI with event sequence, output summary, and no-provider-recall boundary visible
    - ProviderRun replay UI does not expose raw prompt, system prompt, assistant raw content, or provider raw payload
    - restore reads recorded events and provider run summaries and does not create a second provider execution

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
