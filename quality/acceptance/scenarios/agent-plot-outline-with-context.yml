id: agent-plot-outline-with-context
title: AgentRun 章节大纲 Profile 生成待采纳大纲草稿
tier: nightly
surface: tauri
entrypoint: scripts/quality_accept.sh agent-plot-outline-with-context --surface tauri

contract:
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md
  - docs/design/adr/ADR-0021-agent-run-and-turn-boundary-v3.md
  - docs/engineering/scenario-acceptance.md

invariants:
  - agent-step-regated-before-tool-dispatch
  - tentative-artifact-not-production
  - agent-plan-is-not-micro-plan
  - agent-event-is-author-safe

setup:
  provider: slice_verify

user_flow:
  - open: real Tauri workbench
  - send: chapter outline planning request "请基于当前作品规划十二章章节大纲。"
  - wait_for: bounded AgentRun fast ack
  - wait_for: author-safe context observation, next-step planner decision, plot_outline tool step, and completion decision events
  - wait_for: completed agent_run_state
  - verify: final TurnResult is plot_outline with tentative outline_draft

evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
  artifact_dir: artifacts/slice-verify/agent-plot-outline-with-context-tauri

assertions:
  ui:
    - AgentRun panel reaches completed state
    - AgentRun panel shows context observation, next-step planning/gate, outline generation, and completion decision summaries
    - execution brief path shows outline-specific cause labels: planning chapter outline and generating outline candidate
    - outline draft card remains visible as a tentative artifact
  network:
    - parent user_message receives bounded run_id before final TurnResult
    - agent_event includes step_proposed for context, plot_outline execution, and completion decision
    - agent_event includes plan_created, gate_decided, tool_started, tool_completed, and artifact observation
    - final TurnResult carries agent_run.run_id and tool_result.tool_name=plot_outline
    - pending artifact is outline_draft and remains tentative
  data:
    - parent user_message starts bounded AgentRun without sync_turn fallback
    - plot_outline step is allow_tool before toolbox execution
    - consumed_budget reports steps=2, tool_calls=1, provider_calls=4
    - no adoption or production write occurs before author action

anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
