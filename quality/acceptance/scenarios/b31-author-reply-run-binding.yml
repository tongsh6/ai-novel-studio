id: b31-author-reply-run-binding
title: "B31 作者补充输入与待回复任务的稳定绑定（真实工作台多 awaiting run 归属）"
tier: nightly
surface: tauri
default_provider: slice_verify
status_note: >-
  active（2026-10-25 CP2 注册）：外部 Tauri runner 驱动真实工作台（原生窗口 + 真实
  Phoenix/Vite 前端），复验 B31 CP1 冻结语义——确定性 active run 选择、主输入 steer
  条件、可见提示/目标、显式问题 author_choice 绑定，以及 JoinRestore 稳定序下的刷新/
  重连。证据边界：provider 为 slice_verify 确定性替身（绑定/生命周期与模型语义无关）；
  真实模型自然语言语义质量归 B27 §6.1 语义矩阵，本场景不声明语义通过。产品代码在
  CP1（前端 1a1fe079 / 后端）已提交，本场景不改产品代码、不新增验收感知逻辑。
entrypoint: bash scripts/quality_accept.sh b31-author-reply-run-binding --surface tauri
contract:
  - tasks/slices/B31-author-reply-run-binding.md §3 / §5 / §6.2（Q01/Q02/Q05）
  - docs/design/contracts/UA-01-unified-agent-run-loop-contract-pack.md §2.2.2 A（ask_author 持久问题/动作/恢复）、§2.2.3（响应映射）
  - docs/design/adr/ADR-0027-author-obligation-state-v3.md D1（消息与运行分别留痕）/ D3（判断消费真实处置状态）
  - docs/design/adr/ADR-0024-decision-surface-registry-v3.md
  - docs/design/contracts/VS-00D-ai-guided-authoring-contract-pack.md §11.4（普通回复来源）
  - tasks/slices/B23-awaiting-author-reason-and-exit-surface.md、DS03、Q3D
invariants:
  - same-reply-must-not-change-target-run-because-of-restore-order
  - run-binding-scope-consistent（work/session/run/behavior）
  - explicit-question-action-binding-wins（question_ref/expected_goal_version/target_ref/source_turn_ref）
  - no-binding-evidence-must-not-guess-latest-run（不按 Map 插入序/广播到达序选择）
  - no-plain-steer-when-other-run-has-open-question
  - persisted-input-identity-and-original-text-preserved
  - inactive-run-must-not-fake-resume
setup:
  provider: slice_verify
  seed: none（driver 用真实主输入或外部协议 seed 在同一 work/session 内创建两个 live awaiting run；隔离 test DB，不写作者真实作品）
  env_note: >-
    tauri_slice_verify.sh 仅为该场景打开既有 test-support 环境 SLICE_VERIFY_PLAN_EXHAUST=1，
    用于确定性产生「结构调整 plan-exhaust awaiting_author」第二个 run；产品 runtime 不识别
    slice id，env 关闭时其它场景行为逐字节不变。
  trial_matrix:
    - T1: 真实主输入先建 B26 问题 run Q（较旧）再建结构 run S（较新）→ Q open 时普通主输入（两次）+ 显式回复对照 + 回复后残留 steer 目标可见
    - T2: 同 T1 创建顺序 → 刷新/重连 ×3：JoinRestore 广播序稳定；刷新后普通输入仍为新请求；Q 不被误答、S goal 不推进；显式回复正确
    - T3: 外部协议 seed（S 旧、Q 新）→ 刷新恢复 → 语义回答问题的普通输入按新请求处理 + 可见提示；显式回复绑定 Q
    - T4: 外部协议 seed（Q 旧、S 新）→ 刷新恢复 → 普通输入新请求；显式 author_choice target_ref=Q/question_ref/expected_goal_version=1、goal 1→2、completed
    - T5: 两个「无显式问题」live-only run → 歧义时普通输入新请求 + 可见提示与真实任务选择；点选任务后 steer 该 run，wire 带 expected_goal_version，ack 返回 resolved_run_id/binding_source；另一 run 不推进
  isolation: NOVEL_TEST_DB_DIR + MIX_TEST_PARTITION 独立目录；不启动第二个 Phoenix 端口实例。
user_flow:
  - open: 真实 Tauri runner（原生窗口 + 真实前端/后端）打开隔离 work。
  - create: 真实主输入发送带 UA01AWAITSTEER 的自然语言 → B26 显式问题 TurnResult + awaiting_author run。
  - create: 真实主输入/外部协议 seed 发送跨能力结构调整请求（UA01PLANEXHAUST）→ plan-exhaust awaiting_author run。
  - observe: 页面同时可见问题卡（回复此问题）与结构 run 停等坞；Q open 时输入区显示「有任务正在等待你的问题回复…下方输入会作为新请求发送」。
  - send: 普通主输入（不点显式回复）→ 断言发送 `user_message` 新 run、Q 仍 open、结构 run goal_version 不变、可见提示保持；重复输入同样。
  - send: 普通主输入（两个 live-only run 歧义场景）→ 断言 `user_message` 新 run + 「当前有多个任务在进行…」可见提示 + 真实任务选择按钮。
  - click: 点击任务选择中的真实 run（goal 摘要）→ 输入区切换为 steer 模式并显示「将发给：「…」」。
  - send: 主输入 → 断言 `agent_command steer` payload run_id=所选 run、含 expected_goal_version；ack 含 goal_version/resolved_run_id/binding_source，另一 run goal_version 不变。
  - click: 显式「回复此问题」→ author_action author_choice 绑定问题 run（target_ref/question_ref/expected_goal_version）；问题 run 恢复/收束，另一 run 不被推进。
  - reload: 刷新/重连 ×3 → 断言 JoinRestore 广播顺序稳定；刷新后普通输入仍为新请求+提示，不串 run。
evidence:
  required:
    - screenshot
    - websocket_frames
    - app_jsonl
    - summary_json
    - turn_result
    - action_result
  extra_artifacts:
    - b31-cp2-evidence.json（每 trial：可见输入态/发送帧 payload/ack 绑定/goal_version/persist refs/恢复序）
    - b31-cp2-t1-two-awaiting-runs.png
    - b31-cp2-t3-seeded-restored.png
    - b31-cp2-t4-seeded-restored.png
    - b31-cp2-t5-live-only-ambiguous.png
    - b31-cp2-t5-focused-steer.png
    - b31-cp2-final.png
  artifact_dir: artifacts/slice-verify/b31-author-reply-run-binding-tauri
assertions:
  ui:
    - Q open 时输入区显示「有任务正在等待你的问题回复」提示；普通主输入不进入 steer 模式（按钮仍为发送）。
    - 两个 live-only run 歧义时显示「当前有多个任务在进行」提示与 2 个真实任务选择按钮；点击后输入区显示「将发给：「目标摘要」」且按钮变为发送调整。
    - 显式问题卡「回复此问题」入口在普通输入后仍可用；回复后问题卡关闭，残留结构 run 的 steer 目标在输入区可见。
    - 刷新后同一会话的问题卡、停等坞与提示恢复，且不出现旧问题可重复发送。
  network:
    - Q open 时普通主输入发送 user_message（新 turn_id/新 run_id），不发送 agent_command steer；重复输入仍为新 user_message。
    - 显式回复发送 author_action author_choice，target_ref=问题 run、question_ref 与 expected_goal_version 精确绑定；ack accepted、goal_version 恰好 +1。
    - 点选任务后的 steer 发送 agent_command steer，payload.run_id=所选 run 且包含 expected_goal_version；ack 返回 merged goal_version、resolved_run_id 与 binding_source=explicit_steer。
    - 任一输入都只推进目标 run 的 goal_version（1→2），另一 awaiting run 保持 1。
    - JoinRestore 三次重连的 agent_run_reconnect 广播顺序稳定（CP1 Q04 稳定序）。
  data:
    - 普通输入的持久 Interaction 归属新 run（agent_run_id/ submission_id 唯一，原文一致），不是错误 run 的 steer 行。
    - 显式回复的 submission_id/question_ref 持久唯一，问题 run 终态 completed；另一 run 状态不被改写。
    - 刷新/重连后 transcript、open author_question 列表与 run goal_version 与刷新前一致。
anti_hooks:
  product_acceptance_logic_added: false
  data_testid_required: false
  hidden_dom_metadata_required: false
  product_autorun_required: false
anti_hooks_verification: >-
  driver 只使用用户可见语义（主输入 placeholder、发送/发送调整/发送回复/回复此问题按钮、
  问题卡、停等坞、输入区提示与任务选择文案）+ WS 帧 + app JSONL + 公开 session API；
  未新增 data-testid/slice 专用 data-*、产品验收 env/开关或旁路 Channel 注入。T3/T4/T5 的
  历史 run 创建使用外部协议 push 作 seed（证据中标注），被测输入一律来自真实工作台。
prerequisites:
  - B31 CP1 前端确定性选择/主输入条件/目标可见与后端 expected_goal_version/稳定恢复序已提交。
  - B26 显式问题协议/动作绑定可用（本场景对照路径）。
  - 仅 slice_verify 确定性 provider；真实模型语义不在本场景范围。
known_not_closed:
  - 本场景为确定性 provider 的绑定/生命周期证据，不声明真实模型自然语言语义质量（归 B27 §6.1 矩阵）。
  - T3/T4/T5 第二个 run 的创建使用外部协议 seed（复刻 stage 双 run 恢复形状）；真实用户双 run 创建形状由 T1/T2 覆盖。
  - 「明确新话题不被任何 awaiting run 截走」在 T1/T2/T3/T4 已验证为普通输入成新请求；多 open question 的显式选择属后续体验迭代。
  - 待投递重传路径（断线重放的 steer submission）不携带 expected_goal_version（generated schema 未扩）；live send 均携带。CP3 文档/契约同步项已登记。
  - 显式问题回复只由 agent-awaiting-author-*（B26）场景验证；本场景的显式问题对照仅覆盖 author_choice 绑定，不重复 B26 全矩阵。
driver_plan:
  implementation_surface: frontend/slice-verify/external-ui-driver.mjs
  driver_function: driveB31AuthorReplyRunBinding
  verifier: frontend/slice-verify/native-tauri-verifier.mjs（findB31AuthorReplyRunBindingEvidence / b31AuthorReplyRunBindingBehavior，校验 cp2_checks 与 cp2_measured）
  runner: scripts/tauri_slice_verify.sh（allowlist/usage/seed=none + SLICE_VERIFY_PLAN_EXHAUST env）
regression_relations:
  - rel: agent-awaiting-author-steer-resume / agent-awaiting-author-input-required
    relation: 显式问题路径（author_choice/问题卡/composer）不变，本场景作为新增多 run 归属回归；B26 的选项/自由回复矩阵仍由原场景独立承担。
  - rel: q3d-message-delivery-recovery
    relation: Q3D 只验证消息/steer 投递恢复与幂等（2026-10-25 起改用无 open question 的 plan-exhaust awaiting）；显式问题回复归 agent-awaiting-author-*；本场景新增多 run 归属与 steer 目标校验，不替代 Q3D 重传矩阵。
  - rel: DS03 / B23
    relation: runtime_live/terminal 规则继续由 DS03 场景承担；本场景不改状态机，只选择与绑定输入目标。
  - rel: B27 CP4 语义矩阵
    fixture: quality/acceptance/fixtures/b27-semantic-cases/
    relation: 页面绑定 PASS 不能替代 B27 §6.1 真实模型语义矩阵。
