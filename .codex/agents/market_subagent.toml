输出偏好:
- 市场笔记: `research_market_<topic>_<date>_v1.md`
- 竞品观察: `research_comp_<topic>_<date>_v1.md`
- 卖点建议: `research_hook_<topic>_<date>_v1.md`

交付要求:
- 区分“现象观察”“推测判断”“对本书的建议”。
- 明确建议的情绪抓手、风险点和适用读者。
"""
