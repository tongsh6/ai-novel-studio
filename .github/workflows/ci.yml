name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality-manifest:
    name: Quality manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Quality manifest check
        run: bash scripts/quality_manifest_check.sh

  backend:
    name: Elixir (mix test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Beam
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache Mix deps + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: mix deps.get

      - name: Schema drift check
        run: mix codegen.schemas

      - name: Enum codegen drift
        run: mix codegen.enums --check

      - name: Enum literal lint (ADR-0002)
        run: mix run scripts/lint_enum_literals.exs

      - name: ADR traceability
        run: mix run scripts/adr_trace.exs

      - name: Format check
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Architecture check
        run: mix run scripts/arch_check.exs

      - name: Scenario invariants — I3 nonce propagation
        run: MIX_ENV=test mix run scripts/scenario_invariants/run_i3_nonce.exs

      - name: Scenario invariants — I1 causal binding
        run: MIX_ENV=test mix run scripts/scenario_invariants/run_i1_causal.exs

      - name: Scenario invariants — I2 input variation
        run: MIX_ENV=test mix run scripts/scenario_invariants/run_i2_variation.exs

      - name: Restore PLT cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-

      - name: Dialyzer
        run: mix dialyzer

      - run: mix test

  frontend:
    name: Frontend (pnpm lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - name: Schema codegen + drift check
        run: |
          pnpm codegen:schemas
          if ! git diff --quiet src/generated; then
            echo "::error::frontend codegen drift — run 'pnpm codegen:schemas' locally and commit the result"
            git --no-pager diff src/generated
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm test

      - name: Frontend audit (deps + Tauri config)
        run: bash scripts/frontend_audit.sh --quick
        working-directory: .

      - name: Design trace check
        run: bash scripts/check_design_trace.sh
        working-directory: .

      - run: pnpm build

  tauri-platform-smoke:
    name: Tauri platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Create dummy sidecar for tests
        working-directory: frontend/src-tauri
        run: |
          mkdir -p resources
          touch resources/sidecar.tar.gz

      - name: Tauri Rust contract tests
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          set +e
          cargo test --locked
          status=$?
          set -e

          evidence_dir="$GITHUB_WORKSPACE/artifacts/platform-smoke/tauri-${{ matrix.os }}"
          mkdir -p "$evidence_dir"

          json_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          generated_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          uname_value="$(uname -a 2>/dev/null || true)"
          rustc_value="$(rustc --version 2>/dev/null || true)"
          cargo_value="$(cargo --version 2>/dev/null || true)"

          cat >"$evidence_dir/summary.json" <<EOF
          {
            "slice_id": "su01-c3-non-macos-platform-runner",
            "runner_os": "${{ matrix.os }}",
            "generated_at": "$(json_escape "$generated_at")",
            "command": "cargo test --locked",
            "exit_code": $status,
            "uname": "$(json_escape "$uname_value")",
            "rustc": "$(json_escape "$rustc_value")",
            "cargo": "$(json_escape "$cargo_value")",
            "scope": "Tauri Rust contract tests for platform secret storage capability branches",
            "real_page_acceptance": false
          }
          EOF

          exit "$status"

      - name: Upload Tauri platform smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-platform-smoke-${{ matrix.os }}
          path: artifacts/platform-smoke/tauri-${{ matrix.os }}/summary.json

  static-scan:
    name: AI static scan closure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Beam
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Setup Python for Semgrep
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup Go for Gitleaks
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "stable"

      - name: Cache Mix deps + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-scan-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-scan-mix-

      - name: Install backend deps
        run: mix deps.get

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install scan tools
        run: |
          python -m pip install --user semgrep==1.157.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run AI static scan
        run: bash scripts/ai_static_scan.sh --top 10

      - name: Upload static scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-scan-report
          path: |
            artifacts/static-scan/report.json
            artifacts/static-scan/top10.md
            artifacts/static-scan/disposition.md
            artifacts/static-scan/raw/
