name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Elixir (mix test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spike
          POSTGRES_PASSWORD: spike
          POSTGRES_DB: ai_novel_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache Mix deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - run: mix deps.get

      - name: Schema drift check
        run: mix codegen.schemas

      - name: Format check
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Architecture check
        run: mix run scripts/arch_check.exs

      - run: mix test

  frontend:
    name: Frontend (pnpm lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - name: Schema codegen + drift check
        run: |
          pnpm codegen:schemas
          if ! git diff --quiet src/generated; then
            echo "::error::frontend codegen drift — run 'pnpm codegen:schemas' locally and commit the result"
            git --no-pager diff src/generated
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
