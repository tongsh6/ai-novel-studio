name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 原生 Mix release 只含本机 arch 的 ERTS，故不做 universal 单包，而是每个
          # arch 各出一个 dmg、各带匹配的 ERTS：macos-latest=Apple Silicon(arm64)，
          # macos-13=Intel(x86_64)。
          - os: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - os: macos-13
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          # 固定 windows-2022：windows-latest 现为 win25-vs2026 镜像，erlef/setup-beam@v1
          # 无法识别该 ImageOS（"got win25-vs2026, but failed"）。win22 受支持。
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 后端 sidecar：在本平台原生构建 Mix release（含本机 ERTS），暂存到
      # frontend/src-tauri/resources/sidecar，供下一步 tauri build 打包进应用。
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Build backend sidecar (Mix release)
        run: bash scripts/build_sidecar.sh

      - name: Build Tauri
        working-directory: frontend
        run: pnpm exec tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'darwin'
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p artifacts
          cp "frontend/src-tauri/target/${TARGET}/release/bundle/dmg/"*.dmg "artifacts/AI-Novel-Studio_${VERSION}_macos_${ARCH}.dmg" 2>/dev/null || true
          cp "frontend/src-tauri/target/${TARGET}/release/bundle/macos/"*.app.tar.gz "artifacts/AI-Novel-Studio_${VERSION}_macos_${ARCH}.app.tar.gz" 2>/dev/null || true
          ls -la artifacts/ || echo "No macOS artifacts found"

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          cp "frontend/src-tauri/target/${TARGET}/release/bundle/deb/"*.deb "artifacts/AI-Novel-Studio_${VERSION}_linux_amd64.deb" 2>/dev/null || true
          cp "frontend/src-tauri/target/${TARGET}/release/bundle/appimage/"*.AppImage "artifacts/AI-Novel-Studio_${VERSION}_linux_amd64.AppImage" 2>/dev/null || true
          ls -la artifacts/ || echo "No Linux artifacts found"

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows'
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "frontend\src-tauri\target\$($env:TARGET)\release\bundle\msi\*.msi" "artifacts\AI-Novel-Studio_$($env:VERSION)_windows_x64.msi" -ErrorAction SilentlyContinue
          Copy-Item "frontend\src-tauri\target\$($env:TARGET)\release\bundle\nsis\*.exe" "artifacts\AI-Novel-Studio_$($env:VERSION)_windows_x64_setup.exe" -ErrorAction SilentlyContinue
          Get-ChildItem artifacts\

      - name: Upload artifacts
        # 按 target 命名，保证唯一：darwin 现有 arm64 + x64 两个 job，若都用
        # release-darwin 会与 upload-artifact@v4 的同名不可变约束冲突。
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AI Novel Studio ${{ github.ref_name }}"
          body: |
            ## AI Novel Studio ${{ github.ref_name }}

            ### macOS
            - Apple Silicon（M 系列）下载 `..._macos_arm64.dmg`；Intel Mac 下载 `..._macos_x64.dmg`
            - 拖入「应用程序」后**右键点应用 → 打开 → 再点「打开」**（应用为 ad-hoc 签名、未公证）
            - 若提示"已损坏"，在终端执行：`xattr -dr com.apple.quarantine "/Applications/AI Novel Studio.app"` 后再打开

            ### Windows
            - 下载 `.msi` 文件双击安装，或 `.exe` 安装向导
            - 如提示缺少 WebView2，请从 [Microsoft 官网](https://developer.microsoft.com/microsoft-edge/webview2/) 下载安装

            ### Linux
            - `.deb` 用于 Debian/Ubuntu 系列
            - `.AppImage` 通用 Linux 格式，`chmod +x` 后直接运行
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: false
