name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pre-release-checks:
    name: Pre-release checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck / lint / test
        working-directory: frontend
        run: pnpm typecheck && pnpm lint && pnpm test -- --run

      - name: Setup Beam
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache Mix deps + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Mix dependencies
        run: mix deps.get

      - name: Mix compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Mix test
        run: mix test

  build:
    name: Build (${{ matrix.target }})
    needs: pre-release-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # 原生 Mix release 只含本机 arch 的 ERTS，不做交叉编译。macOS 仅保留
          # Apple Silicon 产物；Intel Mac 产物已放弃。
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          # 固定 windows-2022：windows-latest 现为 win25-vs2026 镜像，erlef/setup-beam@v1
          # 无法识别该 ImageOS（"got win25-vs2026, but failed"）。win22 受支持。
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: frontend/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Setup Beam
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache Mix deps + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      # 后端 sidecar：在本平台原生构建 Mix release（含本机 ERTS），暂存到
      # frontend/src-tauri/resources/sidecar，供下一步 tauri build 打包进应用。
      - name: Build backend sidecar (Mix release)
        run: bash scripts/build_sidecar.sh

      - name: Build Tauri
        working-directory: frontend
        run: pnpm exec tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'darwin'
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dmg_src=(frontend/src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg)
          app_src=(frontend/src-tauri/target/${TARGET}/release/bundle/macos/*.app.tar.gz)
          if [[ ! -f "${dmg_src[0]}" ]]; then
            echo "::error::DMG artifact not found for ${TARGET}"
            exit 1
          fi
          cp "${dmg_src[0]}" "artifacts/AI-Novel-Studio_${VERSION}_macos_${ARCH}.dmg"
          if [[ -f "${app_src[0]}" ]]; then
            cp "${app_src[0]}" "artifacts/AI-Novel-Studio_${VERSION}_macos_${ARCH}.app.tar.gz"
          fi
          ls -la artifacts/

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          deb_src=(frontend/src-tauri/target/${TARGET}/release/bundle/deb/*.deb)
          appimage_src=(frontend/src-tauri/target/${TARGET}/release/bundle/appimage/*.AppImage)
          found=0
          if [[ -f "${deb_src[0]}" ]]; then
            cp "${deb_src[0]}" "artifacts/AI-Novel-Studio_${VERSION}_linux_amd64.deb"
            found=1
          fi
          if [[ -f "${appimage_src[0]}" ]]; then
            cp "${appimage_src[0]}" "artifacts/AI-Novel-Studio_${VERSION}_linux_amd64.AppImage"
            found=1
          fi
          if [[ "$found" -eq 0 ]]; then
            echo "::error::No Linux artifact found for ${TARGET}"
            exit 1
          fi
          ls -la artifacts/

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows'
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $msi = Get-Item "frontend\src-tauri\target\$($env:TARGET)\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-Item "frontend\src-tauri\target\$($env:TARGET)\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $found = $false
          if ($msi) {
            Copy-Item $msi.FullName "artifacts\AI-Novel-Studio_$($env:VERSION)_windows_x64.msi"
            $found = $true
          }
          if ($exe) {
            Copy-Item $exe.FullName "artifacts\AI-Novel-Studio_$($env:VERSION)_windows_x64_setup.exe"
            $found = $true
          }
          if (-not $found) {
            Write-Error "No Windows artifact found for $($env:TARGET)"
            exit 1
          }
          Get-ChildItem artifacts\

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: "AI Novel Studio ${{ github.ref_name }}"
          body: |
            ## AI Novel Studio ${{ github.ref_name }}

            ### macOS
            - 仅提供 Apple Silicon（M 系列）版本：下载 `..._macos_arm64.dmg`
            - 拖入「应用程序」后**右键点应用 → 打开 → 再点「打开」**（应用为 ad-hoc 签名、未公证）
            - 若提示"已损坏"，在终端执行：`xattr -dr com.apple.quarantine "/Applications/AI Novel Studio.app"` 后再打开

            ### Windows
            - 下载 `.msi` 文件双击安装，或 `.exe` 安装向导
            - 如提示缺少 WebView2，请从 [Microsoft 官网](https://developer.microsoft.com/microsoft-edge/webview2/) 下载安装

            ### Linux
            - `.deb` 用于 Debian/Ubuntu 系列
            - `.AppImage` 通用 Linux 格式，`chmod +x` 后直接运行
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: false
