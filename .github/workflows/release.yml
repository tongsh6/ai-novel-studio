name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            platform: darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || '' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: frontend
        run: pnpm exec tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Collect artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p artifacts
          cp frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "artifacts/AI-Novel-Studio_${VERSION}_macos_universal.dmg" 2>/dev/null || true
          cp frontend/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz "artifacts/AI-Novel-Studio_${VERSION}_macos_universal.app.tar.gz" 2>/dev/null || true
          ls -la artifacts/ || echo "No macOS artifacts found"

      - name: Collect artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p artifacts
          cp frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb "artifacts/AI-Novel-Studio_${VERSION}_linux_amd64.deb" 2>/dev/null || true
          cp frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage "artifacts/AI-Novel-Studio_${VERSION}_linux_amd64.AppImage" 2>/dev/null || true
          ls -la artifacts/ || echo "No Linux artifacts found"

      - name: Collect artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $VERSION = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "frontend\src-tauri\target\${{ matrix.target }}\release\bundle\msi\*.msi" "artifacts\AI-Novel-Studio_${VERSION}_windows_x64.msi" -ErrorAction SilentlyContinue
          Copy-Item "frontend\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\*.exe" "artifacts\AI-Novel-Studio_${VERSION}_windows_x64_setup.exe" -ErrorAction SilentlyContinue
          Get-ChildItem artifacts\

      - name: Clean up repo placeholders
        run: rm -f artifacts/.gitkeep

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AI Novel Studio ${{ github.ref_name }}"
          body: |
            ## AI Novel Studio ${{ github.ref_name }}

            ### macOS
            - 下载 `.dmg` 文件，双击拖拽安装
            - 首次打开如提示"无法验证开发者"，请在「系统偏好设置 → 安全性与隐私」中点击"仍要打开"

            ### Windows
            - 下载 `.msi` 文件双击安装，或 `.exe` 安装向导
            - 如提示缺少 WebView2，请从 [Microsoft 官网](https://developer.microsoft.com/microsoft-edge/webview2/) 下载安装

            ### Linux
            - `.deb` 用于 Debian/Ubuntu 系列
            - `.AppImage` 通用 Linux 格式，`chmod +x` 后直接运行
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: false
